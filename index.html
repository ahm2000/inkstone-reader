<!doctype html>
<html lang="en" data-site="dark" data-reader="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inkstone Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Lora:wght@400;700&family=Nunito:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#17181c; --ui-card:#0f1012; --ui-line:#2a2b30; --ui-fg:#e8e9ec; --ui-mute:#9a9ca3; --ui-accent:#4f9bf5; --ui-field:#222328;
  --pg-bg:#000; --pg-fg:#fff; --pg-card:#050505; --pg-line:#26272b; --pg-mute:#9a9ca3;
  --c-sys:#6cb3ff; --c-user:#8cbcff; --c-patch:#e7c26b;
  --fs:22px; --lh:1.5; --ff:'Nunito',system-ui,sans-serif; --pgap:.45em; --maxw:760px;
}
html[data-site="light"]{ --ui-bg:#f4f4f6; --ui-card:#fff; --ui-line:#d9dadf; --ui-fg:#1c1d21; --ui-mute:#6a6c74; --ui-accent:#1f6fd6; --ui-field:#ebecf0; }
html[data-reader="charcoal"]{ --pg-bg:#1b1c1f; --pg-fg:#e3e4e7; --pg-card:#131416; --pg-line:#2b2c31; --pg-mute:#92949b; }
html[data-reader="black"]{ --pg-bg:#000; --pg-fg:#fff; --pg-card:#050505; --pg-line:#26272b; --pg-mute:#9a9ca3; }
html[data-reader="midnight"]{ --pg-bg:#0d1424; --pg-fg:#dfe6f5; --pg-card:#0a101d; --pg-line:#1f2a44; --pg-mute:#8e9bb8; }
html[data-reader="sepia"]{ --pg-bg:#f2e8d5; --pg-fg:#3b3024; --pg-card:#f8f0e0; --pg-line:#dccfb4; --pg-mute:#7d6e58; --c-sys:#1a64b8; --c-user:#1a64b8; --c-patch:#9a6a00; }
html[data-reader="ocean"]{ --pg-bg:#06223b; --pg-fg:#e4f0fb; --pg-card:#041a2e; --pg-line:#14405f; --pg-mute:#86a6c0; }
html[data-reader="slate"]{ --pg-bg:#33363d; --pg-fg:#eceef2; --pg-card:#2a2d33; --pg-line:#464a53; --pg-mute:#a2a6b0; }
html[data-reader="white"]{ --pg-bg:#fff; --pg-fg:#1a1a1a; --pg-card:#fff; --pg-line:#dcdde1; --pg-mute:#6a6c74; --c-sys:#1a64b8; --c-user:#1a64b8; --c-patch:#9a6a00; }
html[data-reader="cream"]{ --pg-bg:#f6efd9; --pg-fg:#3a3224; --pg-card:#f6efd9; --pg-line:#dccfb4; --pg-mute:#7d6e58; --c-sys:#1a64b8; --c-user:#1a64b8; --c-patch:#9a6a00; }
html[data-reader="tan"]{ --pg-bg:#f1dcb6; --pg-fg:#3b2f1c; --pg-card:#f1dcb6; --pg-line:#d9c196; --pg-mute:#7a6746; --c-sys:#1a5aa5; --c-user:#1a5aa5; --c-patch:#8a5a00; }
html[data-reader="sky"]{ --pg-bg:#dce9f1; --pg-fg:#1d2b36; --pg-card:#dce9f1; --pg-line:#bcd0de; --pg-mute:#5c7384; --c-sys:#1a5aa5; --c-user:#1a5aa5; --c-patch:#8a5a00; }
html[data-reader="rose"]{ --pg-bg:#f7e2e2; --pg-fg:#3a2326; --pg-card:#f7e2e2; --pg-line:#e4c4c4; --pg-mute:#8a6468; --c-sys:#1a5aa5; --c-user:#1a5aa5; --c-patch:#8a5a00; }
html[data-reader="mint"]{ --pg-bg:#d9e8d6; --pg-fg:#1f3023; --pg-card:#d9e8d6; --pg-line:#bcd2b7; --pg-mute:#5d7a62; --c-sys:#1a5aa5; --c-user:#1a5aa5; --c-patch:#8a5a00; }
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--pg-bg);color:var(--pg-fg);font-family:system-ui,Segoe UI,sans-serif;min-height:100vh;padding-bottom:0}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top header */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ui-bg);border-bottom:1px solid var(--ui-line);color:var(--ui-fg);position:sticky;top:0;z-index:30}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto;font-size:16px}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--ui-mute);padding:6px 10px;border-radius:8px;font-size:14px}
.tbtn:hover{color:var(--ui-fg);background:var(--ui-field)}
.tbtn.sq{border:1px solid var(--ui-line);color:var(--ui-fg);padding:6px 9px}

/* reader cards */
#reader{max-width:var(--maxw);margin:14px auto 0;padding:0 12px}
body[data-width="narrow"]{--maxw:620px} body[data-width="wide"]{--maxw:940px}
.card{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.novelname{color:var(--pg-mute);font-size:14px;cursor:pointer}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nbtn{background:var(--pg-bg);border:1px solid var(--pg-line);color:var(--pg-fg);padding:7px 14px;border-radius:8px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nbtn:hover:not(:disabled){border-color:var(--ui-accent)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.navmid{text-align:center;font-size:14px;line-height:1.3}
.navmid b{font-weight:600}
.navmid span{display:block;color:var(--pg-mute);font-size:13px}
.seg{display:flex;border:1px solid var(--pg-line);border-radius:8px;overflow:hidden;margin-top:10px}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--pg-line);padding:7px 6px;font-size:14px;color:var(--pg-fg)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pg-bg);box-shadow:inset 0 -2px 0 var(--ui-accent)}
.chtitle{font-size:20px;margin:4px 0 0}
.chtitle b{margin-right:6px}
.chipline{display:flex;align-items:center;margin:10px 0 6px}
.chipline:before,.chipline:after{content:"";flex:1;border-top:1px solid var(--pg-line)}
.chip{font-size:12px;border:1px solid var(--pg-line);background:var(--pg-bg);border-radius:8px;padding:3px 10px;margin:0 8px;color:var(--pg-fg)}

/* chapter text */
#chBody{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:left}
body[data-align="justify"] #chBody{text-align:justify}
body[data-pspace="compact"] #chBody{--pgap:.2em} body[data-pspace="wide"] #chBody{--pgap:.9em}
#chBody p{margin:0 0 var(--pgap)}
body[data-indent="on"] #chBody p{text-indent:1.6em}
#chBody .chhead{font-size:1.15em;font-weight:700;margin:.4em 0 .8em}
#chBody .chsec + .chsec{margin-top:2.4em;padding-top:1.6em;border-top:1px dashed var(--pg-line)}
.term{border-radius:3px}
body[data-tstyle="semi"] .term{font-weight:600} body[data-tstyle="bold"] .term{font-weight:700}
body[data-tstyle="underline"] .term{text-decoration:underline;text-underline-offset:3px}
body[data-tstyle="italic"] .term{font-style:italic}
body.tc-on.tc-sys .t-sys{color:var(--c-sys)} body.tc-on.tc-user .t-user{color:var(--c-user)} body.tc-on.tc-patch .t-patch{color:var(--c-patch)}
body.old #reader .card{background:transparent;border-color:transparent;padding-left:0;padding-right:0}
body.old #chBody{font-family:Georgia,'Times New Roman',serif;text-align:justify}
.endnav{display:flex;gap:10px;justify-content:space-between;margin:26px 0 8px}
.sentinel{height:1px}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;align-items:center;pointer-events:none;border-top:1px solid var(--ui-line)}
#dock>*{pointer-events:auto}
#dockPanel{width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-top:0;border-bottom:0;border-radius:0;padding:8px 10px;max-height:56vh;overflow:auto}
#dockTabs{width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);display:flex;background:var(--ui-card);border:1px solid var(--ui-line);border-top:0;border-bottom:0;color:var(--ui-mute)}
#dockTabs button{flex:1;background:transparent;border:0;border-top:2px solid transparent;padding:5px 4px 6px;font-size:12px;color:var(--ui-mute);display:flex;flex-direction:column;align-items:center;gap:0}
#dockTabs button.on{color:var(--ui-fg);border-top-color:var(--ui-accent);background:var(--ui-bg)}
.grip{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);width:44px;height:16px;border-radius:8px 8px 0 0;border-bottom:0;margin-bottom:-1px;font-size:10px;line-height:12px;padding:0}
.lab{font-size:12px;letter-spacing:.06em;color:var(--ui-mute);text-transform:uppercase;margin:8px 0 4px}
.lab:first-child{margin-top:0}
.row{display:flex;gap:0;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;background:var(--ui-card)}
.row.gap{gap:8px;border:0;background:transparent;overflow:visible}
.row button{flex:1;background:transparent;border:0;border-right:1px solid var(--ui-line);padding:6px 6px;font-size:13px;color:var(--ui-fg)}
.row button:last-child{border-right:0}
.row button.on{background:var(--ui-field);box-shadow:inset 0 -2px 0 var(--ui-accent)}
.row.gap button{border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-card)}
.bigbtn{width:100%;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:8px;padding:7px;font-size:13px;color:var(--ui-fg)}
.bigbtn:hover,.row button:hover{background:var(--ui-field)}
.swatches{display:flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
.swatches button{flex:1;border:0;padding:8px 0;font-weight:700;font-size:15px}
.swatches button.on{outline:2px solid var(--ui-accent);outline-offset:-2px}
.novelcard{display:flex;align-items:center;gap:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-card);padding:3px 8px;text-align:left}
.cover{width:34px;height:44px;border-radius:5px;background:linear-gradient(160deg,#c0762c,#5b2a0c 60%,#1b0d05);color:#ffe3b5;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.04em}
.novelcard small{display:block;color:var(--ui-mute);font-size:11px;letter-spacing:.08em}
.novelcard span{font-size:13px;line-height:1.2}
#dockPanel .nbtn{padding:4px 12px;font-size:13px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav .nbtn{min-width:76px}
.dnav .navmid{flex:1}
.novelcard .nt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.novelcard .chev{margin-left:auto;font-size:18px;color:var(--ui-mute)}
.two>*{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.switch{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px}
.switch input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--ui-line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ui-accent)}
.switch input:checked:after{left:19px}

/* drawers */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(420px,94vw);background:var(--ui-bg);color:var(--ui-fg);border-right:1px solid var(--ui-line);z-index:70;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .2s}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ui-line)}
.dhead h3{margin:0;font-size:17px;flex:1}
.xbtn{background:transparent;border:0;color:var(--ui-fg);font-size:22px;line-height:1;padding:2px 6px}
.dtabs{display:flex;gap:2px}
.dtabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ui-mute);padding:6px 10px;font-size:14px}
.dtabs button.on{color:var(--ui-fg);border-bottom-color:var(--ui-accent)}
.dbody{flex:1;overflow:auto;padding:14px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--ui-line)}
.toc-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--ui-line);padding:12px 14px;color:var(--ui-fg)}
.toc-item b{display:block;font-weight:600;font-size:14px}
.toc-item small{color:var(--ui-mute);font-size:11px;letter-spacing:.05em}
.toc-item.on{color:var(--ui-accent)} .toc-item.on:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ui-accent);margin-left:8px}
.field{width:100%;background:var(--ui-field);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px}
.field:focus{outline:2px solid var(--ui-accent);outline-offset:-1px}
.frow{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px;font-size:13px}
.frow label{color:var(--ui-mute)}
.pill{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:5px 10px;font-size:13px;margin-left:6px}
.hint{font-size:12px;color:var(--ui-mute);margin:6px 0}
.btn{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:9px 16px;font-size:14px}
.btn.pri{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
.trow{display:flex;gap:10px;align-items:center;border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.trow .tt{flex:1;font-size:13px;line-height:1.5;word-break:break-word}
.trow .tt small{color:var(--ui-mute);display:block}
.trow .tt b{font-weight:600}
.chipbtn{display:inline-block;border:1px solid var(--ui-line);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--ui-mute);margin:10px 0 8px}
.preview{background:#000;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:12px;font-size:15px;line-height:1.6}
.addterm{position:absolute;left:0;top:0;z-index:50;white-space:nowrap;background:var(--ui-card);color:var(--ui-accent);border:1px solid var(--ui-accent);border-radius:8px;padding:8px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.4)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.mbox{background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:12px;width:min(640px,100%);padding:16px}
.lib{display:flex;gap:12px;border:1px solid var(--ui-line);background:var(--ui-card);border-radius:10px;padding:10px;margin-top:10px}
.lib .cover{width:64px;height:86px;font-size:16px}
.lib h4{margin:0 0 4px;font-size:16px}
.lib p{margin:2px 0;color:var(--ui-mute);font-size:13px}
.bar{height:6px;background:var(--ui-line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ui-accent)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;border:1px solid #444;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .18s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* term popover, badges, spinner */
.term{cursor:pointer}
.tpop{position:absolute;z-index:55;width:320px;max-width:calc(100vw - 16px);background:#0b0c0f;color:#fff;border:1px solid #2a2b30;border-radius:10px;padding:10px 12px;font:13px/1.4 system-ui,Segoe UI,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.tpop .pr{display:flex;align-items:center;gap:10px;margin:6px 0;min-height:24px}
.tpop .pr b{width:34px;text-align:right;font-size:12px;font-weight:700;flex:none}
.tpop .pf{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tpop .phelp{font-size:12px;color:#aeb0b8;margin:6px 0 0 44px}
.hbtn{width:30px;height:30px;border-radius:50%;border:1px solid #3a3b41;background:transparent;color:#fff;font-size:14px}
.bdg{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;max-width:100%}
.bdg i{font-style:normal;padding:3px 7px;display:flex;align-items:center}
.bdg em{font-style:normal;padding:3px 9px;display:flex;align-items:center;word-break:break-word}
.bdg.g i{background:#0a3a22;color:#d6ffe6} .bdg.g em{background:#0f7a40;color:#fff}
.bdg.b i{background:#16398a;color:#dbe6ff} .bdg.b em{background:#1f5bd1;color:#fff}
.bdg.opt{border:0;padding:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:#fff;background:none}
.bdg.opt:hover:not(:disabled){filter:brightness(1.2)}
.bdg.opt.on{outline:2px solid rgba(255,255,255,.65);outline-offset:1px}
.bdg.opt:disabled{cursor:default;opacity:.8}
.tin{background:transparent;border:0;outline:0;color:#fff;font:inherit;font-weight:700;padding:0;min-width:3ch;max-width:220px;cursor:text}
.bdg.g em.ed{padding:3px 9px}
.bdg.g em.ed:focus-within{background:#13924d}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.hrow .hint{margin:0}
.btn.danger{background:rgba(220,60,80,.16);color:#ff7d8c;border-color:rgba(220,60,80,.4)}
.btn.sq{padding:8px 12px;border-radius:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.spin.sm{width:14px;height:14px}
.btn.pri.sv:disabled{opacity:1;cursor:default;min-width:84px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- header icons, menu, search, user dropdown ---- */
.top{background:#1c2026;color:#e8e9ec;border-bottom:1px solid #2c3038;gap:8px;padding:8px 10px}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid #3a3f47;color:#e8e9ec;border-radius:9px;padding:0;flex:none}
.ibtn:hover,.ibtn.on{background:#2a2e35}
svg.i,.ibtn svg,[data-ic] svg,.mitem svg,.uitem svg,.mcard svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:.04em;margin-right:auto;color:#e8e9ec}
.brand svg{width:26px;height:26px;stroke-width:1.6}
.sbox{display:none;flex:1;align-items:center;gap:8px}
.top.searching .sbox{display:flex}
.top.searching .brand,.top.searching .hid-s{display:none}
.sinp{flex:1;min-width:0;background:#2a2e35;border:1px solid #3a3f47;color:#fff;border-radius:9px;padding:9px 12px;font:inherit;font-size:15px}
.sinp:focus{outline:2px solid var(--ui-accent);outline-offset:-1px}
#searchRes{position:fixed;left:0;right:0;top:57px;bottom:0;background:var(--ui-bg);color:var(--ui-fg);overflow:auto;z-index:35}
.sres{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--ui-line);padding:12px 14px;color:var(--ui-fg)}
.sres b{display:block;font-weight:600;font-size:14px}
.sres span{display:block;color:var(--ui-mute);font-size:13px;margin-top:3px;line-height:1.4}
.sres mark{background:rgba(79,155,245,.3);color:inherit;border-radius:3px}
#userMenu{position:fixed;right:8px;top:58px;width:min(330px,calc(100vw - 16px));background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:65;padding:12px}
.ucard{border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.ucard .bar{margin:6px 0 0}

<script>
(function(){
"use strict";
var NOVEL = {"title": "Reclined Sovereign: Just an Ordinary Office Worker", "chapters": [{"n": 1, "title": "Leave on Time", "raw": "# Chapter 1: Leave on Time\n\nQingyan City, Hengxin Logistics Group, Operations Department.\n\nFriday, 4:40 p.m.\n\nChen Xuan checked the clock in the corner of his monitor and smiled to himself.\n\nOnly fifteen minutes left before he could pack up without drawing stares, and fifty minutes until the 6:10 express bus left for Yunxi County. If he caught it, he'd be sitting at his mother's table before eight with a steaming bowl of pork-rib soup in front of him.\n\nTo be honest, that was his entire ambition for the weekend, and he thought it was a pretty good one.\n\nAt Hengxin Logistics, Chen Xuan was a mid-level operations supervisor making 12,000 yuan a month. In a provincial capital like Qingyan, that was comfortable ordinary pay, enough to rent a small place near work, eat well, and send a little money home without anyone getting jealous. He never fought for bonuses, never tagged along to the boss's drinking dinners, and never stayed a single minute late. His secret was simple: finish everything before lunch, then drink hot tea and rest all afternoon.\n\n\"Supervisor Chen, do you have a minute?\"\n\nA nervous voice pulled his eyes off the clock.\n\nDepartment Manager Hu Dewei stood beside his desk, clutching a ceramic mug the size of a flowerpot while his other hand tugged at his tie. He always looked like a man who had just heard bad news.\n\n\"Sure, Manager. What's up?\"\n\n\"It's the port bills.\" Hu Dewei coughed awkwardly and looked away. \"Three cargo containers cleared customs this month, and every invoice has to be checked against the shipping records. General Manager Sun wants the audit on his desk Monday at nine sharp. I know it's Friday, and I hate to ask, but somebody has to stay late tonight.\"\n\nThe whole office went dead quiet!\n\nEveryone stared down at their keyboards, praying the manager wouldn't look their way.\n\n\"I can stay, Manager!\"\n\nBefore three seconds passed, Zhang Pengfei shot up from his chair. Always dressed in a crisp suit, he was the first man in every morning and the last out every night, hungry for the next promotion. \"I've already worked nineteen late nights this quarter! One more Friday means nothing to me. I never leave work half-done, not like some people who vanish the second the clock hits five.\"\n\nHe tilted his chin straight toward Chen Xuan when he said \"some people.\"\n\n\"Pengfei really is the hardest worker on this floor!\" Sister Pan chimed in loudly from the next cubicle. She was the oldest clerk in the department, with sharp eyes and a loud opinion about everybody's business.\n\nSeveral younger clerks traded uneasy glances. Everybody knew Zhang Pengfei had been trying to make Chen Xuan look lazy for weeks.\n\nChen Xuan didn't look bothered at all. He reached out, nudged his mouse, and spoke in an easy, mild voice.\n\n\"Wait a second, Manager. That audit is already finished. I put the file in the shared folder at 11:20 this morning.\"\n\nSilence.\n\n\"Finished?\" Hu Dewei blinked twice, wondering if he'd heard wrong. \"All three containers?\"\n\n\"Mm,\" Chen Xuan said, nodding lightly. \"And I caught a mistake on the second container. The port agent billed us twice for storage. I marked the line in yellow.\"\n\nHu Dewei hurried to the nearest computer and clicked into the folder. As he scrolled down the columns, the doubt on his face turned into surprise, and then straight into shock!\n\nEvery invoice matched to the decimal. At the bottom, marked in neat yellow, sat a calm note: *Overcharged 14,000 yuan for duplicate storage. Please request a refund.*\n\nFourteen thousand yuan, more than an entire month of Chen Xuan's own salary, saved without a single word of bragging!\n\n\"Eleven-twenty?\" Sister Pan blurted out, her jaw dropping. \"He finished all three containers before lunch?! But he went down to eat at noon, and at two o'clock he was napping with his head on his arms!\"\n\n\"He checked all three containers in one morning?\"\n\n\"And caught a fourteen-thousand-yuan error?!\"\n\n\"Supervisor Chen works way too fast!\"\n\n\"Wait, why didn't he even tell Manager Hu he saved fourteen thousand yuan?\"\n\nWhispers rippled across the whole floor.\n\nIn the middle of the room, Zhang Pengfei stood frozen with his mouth half open, feeling as if someone had slapped him right in front of the entire department!\n\nFor three weeks he'd waited for Chen Xuan to make just one careless mistake so everyone could see who truly deserved the promotion. And now? While Zhang Pengfei was gearing up to sacrifice his Friday night like a hero, the job had been done since morning, and Chen Xuan was sitting right there, calmly peeling the wax paper off a red-bean bun!\n\nWas it a trick? Did he copy someone's spreadsheet, or did he have a secret contact at the port? And why on earth would a man save the company fourteen thousand yuan and not even send an email to take credit?\n\nZhang Pengfei's face burned bright red. Humiliated and angry, he sank back into his chair and clenched his jaw. Next week, he swore to himself, he'd check every report three times, no, four times!\n\n\"Well, then, Supervisor Chen, you can head home,\" Hu Dewei said, his voice oddly dry.\n\nEver since March, Hu Dewei had felt a strange nervousness whenever Chen Xuan stood nearby, and he couldn't explain why. Chen Xuan never shouted, never broke a rule, and never acted like a big shot. So why did Hu Dewei always feel an urge to straighten his back the moment Chen Xuan walked past?\n\nHe had no answer, and not knowing only made his palms sweat more.\n\n\"Thank you, Manager. Have a good weekend.\"\n\nChen Xuan tucked the red-bean bun into his canvas bag, picked up his scratched old green thermos, and walked out at 4:55 sharp while the whole floor watched his back.\n\nIn the hallway, the elevator was already waiting on the twelfth floor, its doors wide open.\n\nIn three years of working in this building, that had never happened once on a Friday afternoon.\n\n\"Lucky,\" Chen Xuan thought happily, and stepped inside.\n\nQingyan Express Bus Station, 5:50 p.m.\n\nThe waiting hall was packed and noisy, smelling of fried dough, tea eggs, and diesel fumes, while a loudspeaker called out county names he'd never visited.\n\nChen Xuan bought a 68-yuan ticket for the 6:10 bus to Yunxi County and took his usual spot at Gate Six, tucked behind a pillar out of the draft. Almost every Friday for three years, he'd stood right here.\n\nSuddenly, his phone buzzed.\n\nIt was a voice message from his mother, Liu Meifang. She had the loudest voice in the family, and even when she was crying, she didn't turn the volume down a single notch.\n\n\"Xuan, listen, don't panic! The police took your Second Uncle away this afternoon! At two o'clock, straight out of his own shop, in handcuffs, in front of the whole street! Your father ran to the police station and they wouldn't even let him inside! Your Second Aunt has been sitting on our sofa since three and hasn't drunk a drop of water! They claim he beat somebody up. How could that be true?! Your Second Uncle's hands shake when he scales a fish! Come home as fast as you can!\"\n\nChen Xuan stood still by the pillar and played the message a second time.\n\n\"Hmm?\"\n\nHis Second Uncle, Chen Mingde, was his father's younger brother, a soft-spoken man who'd run a tiny hardware shop on Yunxi's Old Street for over twenty years. When Chen Xuan was seven, Second Uncle had taught him how to fish. Every New Year, even in lean winters when the shop barely paid rent, Second Uncle still pressed a crisp red envelope into his hand.\n\nA man like that, beating someone up in broad daylight? And the police hauling him off in handcuffs from his own counter?\n\nChen Xuan didn't flare up in anger. Instead, a quiet, steady weight settled in his chest, like seeing someone you love caught in the rain and knowing you have to bring them an umbrella.\n\nHe typed with his thumb: *I'm on the 6:10 bus. Don't worry. Please eat dinner first.*\n\nRemembering how his mother skipped meals whenever she worried, he added one more line: *Mom, eat first.*\n\nHis family always joked that his calm temper was laziness. To be honest, it wasn't laziness at all. It was just a simple rule his grandfather had taught him long ago: when something goes wrong, ask once, politely. If the answer isn't right, ask again, politely.\n\nThe gate clicked open. Chen Xuan climbed aboard and took a window seat on the right.\n\nA minute later, a plain-looking middle-aged man in a faded gray jacket boarded right before the doors hissed shut. Carrying a small dark canvas bag on his lap, he sat three rows behind Chen Xuan and closed his eyes at once, like any tired worker heading home for the weekend.\n\nChen Xuan didn't glance back once. He ate his red-bean bun and watched the lights of Qingyan City drift past the window, one by one.\n\nThree rows behind him, the man in the gray jacket cracked one sharp eye open. Inside his half-zipped canvas bag, a slim black phone lit up silently with a single line of green text. He glanced down, tapped three quick words on the screen, and slid his hand smoothly back over the bag.\n"}, {"n": 2, "title": "Old Street", "raw": "# Chapter 2: Old Street\n\nYunxi County, Old Street, Mingde Hardware. Friday, 1:30 p.m.\n\nThe little shop smelled of machine oil, hemp rope, and old wood. Chen Mingde could walk behind his counter with his eyes closed and find any screw a customer asked for in three seconds flat.\n\nBehind him stood a wall of small wooden drawers, every one labeled in his neat square handwriting: M4, M5, M6, flat head, brass. Every Spring Festival when Chen Xuan was small, the boy used to perch on the high stool by the counter and read those labels aloud until he nodded off.\n\nToday, a stranger sat on that stool.\n\nFor nine straight days, four men had lounged in his shop every afternoon. They didn't shout or smash a single shelf. They just crossed their legs, blew thick cigarette smoke into the air, and stared at him without blinking. Regular customers took one look through the doorway and hurried across the street.\n\nThey looked like men paid to sit until an old shopkeeper broke.\n\n\"Old Chen.\"\n\nAt last, the man with the thick gold chain stood up. Dong Haisheng, boss of Hongrui Real Estate, had a smooth face and a polite smile that never reached his eyes. \"It's one-thirty. I've waited nine days. Even my patience runs out eventually.\"\n\n\"I'm sorry, Boss Dong,\" Chen Mingde said, gripping the edge of the counter. \"I can't sign.\"\n\n\"Four hundred and fifty-six thousand yuan. Cash, wired within a week.\"\n\n\"Boss Dong, my shop is a hundred and twenty square meters on the corner! On Old Street, a shop like mine is worth nearly a million!\"\n\n\"I know what you think it's worth.\" Dong Haisheng's smile didn't budge an inch. \"Old Chen, a thing is only worth what somebody will pay for it.\"\n\nChen Mingde fell silent, his heart hammering hard against his ribs.\n\nHe wasn't a brave man, and he knew it. His wife teased him that he couldn't win a fight against a chicken. Still, this shop was twenty-two years of his life! It had paid his daughter's university tuition and kept the family fed without begging anyone for a yuan. At normal market prices, his corner shop was worth nearly one million yuan. Dong Haisheng was offering less than half. In Yunxi County, 456,000 yuan couldn't even buy a replacement storefront, let alone keep his family going. Once he signed, their livelihood was gone forever!\n\nHe couldn't do it. He simply couldn't.\n\n\"Then I'm afraid we have a problem,\" Dong Haisheng sighed, giving a tiny nod toward the door.\n\nA young man in a neat driver's uniform had been standing quietly beside the stacked paint cans. He looked at Chen Mingde, glanced back at Dong Haisheng, and swallowed hard.\n\nThe next instant, the driver threw himself sideways straight into the metal paint shelf!\n\nCrash!\n\nPaint cans clattered and rolled all across the floor. The driver hit the concrete on his back, clutched his shoulder, and howled loud enough to wake the entire lane!\n\n\"He hit me! Help! This crazy old man attacked me!\"\n\nChen Mingde froze behind the counter, still holding a cardboard box of steel washers in both hands.\n\nHe hadn't moved an inch! Was this some kind of sick joke? Before he could shout that he hadn't touched anyone, two uniformed police officers walked briskly through the front door.\n\nIt was 2:05 p.m. sharp.\n\nSo fast, Chen Mingde thought, a chill rushing down his spine. They didn't even have to run. They'd been waiting outside!\n\n\"Chen Mingde?\" the taller officer barked, snapping open silver handcuffs. \"You're suspected of assault and injuring another person. Come with us!\"\n\n\"I never laid a finger on him!\" Chen Mingde cried, his voice shaking. \"Ask anyone out there! Ask my neighbors!\"\n\n\"Save your story for the station.\"\n\nThe steel cuffs bit cold around his wrists. Outside, a hushed crowd had already gathered along Old Street.\n\n\"Wait, Old Chen didn't even step out from behind his counter!\" someone muttered under their breath.\n\n\"Shh! Keep your voice down! That's Boss Dong from Hongrui Real Estate.\"\n\n\"What can an ordinary shopkeeper do against people like that?\"\n\nBy the tailor's doorway, Old Yu shook his gray head bitterly, unable to meet his friend's eyes. Across the lane, Meng Xiaofang from the steamed-bun stall clapped a hand over her mouth. Nobody dared step forward.\n\nDon't shout, Chen Mingde told himself, holding his back straight inside the patrol car. His wife would hear about this in ten minutes, and she'd already have enough to carry.\n\nThrough the rear window, he watched his hand-painted sign shrink into the distance: MINGDE HARDWARE, red letters he'd brushed on himself. He remembered seven-year-old Chen Xuan yanking too hard on a bamboo fishing pole by the river. \"Don't pull back when the fish pulls,\" he'd told the boy. \"Wait. Let it wear itself out.\"\n\nHe could wait. If there was one thing an old shopkeeper knew how to do, it was wait.\n"}, {"n": 3, "title": "The Booking Desk", "raw": "# Chapter 3: The Booking Desk\n\nYunxi County, Old Street Police Station. Friday, 2:40 p.m.\n\nWei Kun sat behind the booking desk, staring down at his intake form.\n\nOld Street Station had thirty-six staff on the roster, though only ten were formal police officers. The other twenty-six were auxiliary officers on one-year contracts who carried batons instead of guns and could never be promoted.\n\nThe station's official chief was Cheng Biao, who also held the higher post of Deputy Director at the county police bureau, so he rarely sat in this small building. Normally, the Political Instructor, Qiu Guoqiang, the steady second-in-command who actually kept the station running by the book, handled daily work. Conveniently, two weeks ago, both Qiu Guoqiang and the station's deputy chief had been \"sent to a training course,\" leaving the keys and all the dirty files dumped on duty officer Wei Kun.\n\nIn twelve years behind this desk, Wei Kun had booked over three hundred suspects. This thin, gray-haired shopkeeper wouldn't make trouble. He kept his eyes on the floor and answered quietly. Under Attitude, Wei Kun wrote: Calm.\n\nThen he flipped to the attached evidence, and his pen stopped dead!\n\nClipped to the file was a private clinic's injury note for Boss Dong's driver, stamped 1:50 p.m.\n\nWei Kun's neck went ice-cold!\n\nThe arrest had happened at 2:05 p.m. The doctor's injury note had been signed fifteen minutes before the assault even happened!\n\nIt was fake, prepared in advance. And Wei Kun knew perfectly well whose signature sat on the detention order.\n\nShould he speak up? To whom?\n\nAfter twelve years on the force, Wei Kun understood the bitter math of government rank. To put it nicely, he held a senior pay grade on paper, deputy principal staff member; to put it bluntly, it was an empty title with zero real power! Nobody worked under him, and he couldn't sign a single binding order. Cheng Biao, on the other hand, held a real leadership post as Deputy Director of the county police bureau and head of this station. One real step separated the man who gave orders from the man who filled out forms.\n\nAnd Wei Kun still had a 2,800-yuan monthly mortgage hanging over his head, plus a wife seven months pregnant who could barely tie her own shoes.\n\nCheng Biao's warning at the morning meeting still rang in his ears: \"You fill in the forms, Wei. Thinking is my job.\"\n\nWei Kun swallowed hard and kept writing until he reached the box marked Time of Decision, where police had to record when they legally decided to detain a suspect. His fingers refused to move. He left it blank.\n\n\"Don't fill that box in yet.\"\n\nCheng Biao had strolled in quietly, wearing a black leather jacket over his uniform trousers, a wooden toothpick rolling between his teeth. \"We'll write the time in later.\"\n\n\"Yes, Director Cheng,\" Wei Kun said stiffly. In government offices, lower officers always dropped the word \"deputy\" and called a boss by his highest title, especially a man whose signature could lock anyone in Yunxi behind bars for fifteen days.\n\nCheng Biao perched casually on the corner of the desk, smiling down at Chen Mingde like a friendly uncle at a family dinner.\n\n\"Old Chen, let's be honest,\" he said softly. \"Assaulting a man in public means ten days in detention, maybe fifteen, plus a police record. Your daughter's in college, right? Think about how she'll have to explain her father's record at every job interview. Now, it doesn't have to be ugly. Sign the buyout contract, Hongrui drops the complaint, and you're home for dinner in ten minutes.\"\n\nSilence hung over the desk.\n\n\"Director Cheng,\" Chen Mingde said quietly, not looking up. \"I want to see the written detention order first.\"\n\nCheng Biao blinked. \"What?\"\n\n\"The official paper saying why you're holding me, and when it was signed. I want to see it first.\"\n\nThe toothpick between Cheng Biao's lips stopped moving!\n\nEleven Old Street owners had sat in that chair over the past two months. Eleven times, they'd broken down and signed. Why was this twelfth man, a nobody with a tiny shop and zero connections, calmly asking for official paperwork?\n\nWas he stubborn, stupid, or did he know someone?\n\nUnease prickled down Cheng Biao's neck. Too much rode on this corner shop: his brother-in-law's 38-million-yuan demolition contract, the villa his wife wanted, and next Wednesday, when the provincial inspection team arrived in Yunxi County! Those were senior anti-corruption investigators sent straight from the provincial capital to hunt for scandals and hear citizen complaints. One dirty land grab exposed to them could end a local official's career in a single afternoon!\n\nWednesday sat on Cheng Biao's chest like a heavy stone.\n\n\"Fine, Old Chen,\" he snapped, his friendly mask vanishing. \"Wait for your paper, then. Lock him up, Wei. A cold night in the cell will clear his head!\"\n"}, {"n": 4, "title": "Watching and Waiting", "raw": "# Chapter 4: Watching and Waiting\n\nQingyan City, a quiet walled courtyard in the east of town. Friday, 6:15 p.m.\n\n\"Chief, this is Nine.\"\n\nThe low, steady voice came from a small encrypted speaker on a dark wooden desk. Beside it sat a white-haired elder with soldier-straight posture, a cup of tea cooling untouched by his elbow.\n\nHis name was An Zhiyuan, Chief An to everyone in the hidden protection force. His serial number was Two, meaning across the entire elite network guarding Chen Xuan from the shadows, only one person ranked higher than him.\n\n\"Go ahead, Nine.\"\n\n\"The Boss is on the 6:10 express bus to Yunxi County,\" reported Nine, the plain man in the gray jacket sitting three rows behind Chen Xuan. \"At 5:52, his mother sent a voice message. His second uncle, Chen Mingde, was handcuffed and taken from his hardware shop by local police at 2:05. The Boss listened twice and said one word: 'Hmm.'\"\n\n\"Only 'hmm'?\" Chief An raised an eyebrow.\n\n\"Yes, Chief. Then he texted his mother to eat dinner first. He's completely calm, hasn't sent any signal, and ate a red-bean bun.\"\n\nSilence settled over the study. Chief An looked down at his cooling tea, a mix of deep warmth and helpless frustration softening his eyes.\n\nNobody at Hengxin Logistics, not even Chen Xuan's own parents, had the faintest idea who Chen Xuan really was. They thought he was just an easygoing operations supervisor riding a county bus home for soup. They didn't know his file sat sealed at the highest secret level in the country, or that a quiet team of veteran security officers, analysts, and lawyers watched over every city he lived in. They certainly didn't know that one real emergency request from him could trigger an immediate top-level review across the province, though even his own force lived by strict rules: never break the law, never skip proper steps without real cause.\n\nYet his uncle had been hauled out of his shop in handcuffs in front of an entire street, and what had the Boss done? Told his mother to eat and chewed a red-bean bun.\n\nDidn't he know one word from him could have investigators moving on Yunxi County before his bus even pulled into the station?\n\nOf course he knew. He simply refused to pull strings on what might still be an ordinary problem. That was Chen Xuan's iron rule: handle things the normal, lawful way first, like any citizen, and never step in unless someone truly crossed the line.\n\nTo be honest, that was why an old veteran like Chief An respected him from the bottom of his heart, and why Chief An kept losing sleep!\n\n\"Nine, here are my orders,\" Chief An said crisply. \"Stay on the bus and keep out of his sight. Contact Number Twenty-three in Yunxi, Gong Yi's unit. Tell them to keep quiet eyes on the family apartment and the Old Street shop tonight.\"\n\nWherever Chen Xuan's family lived, Chief An always kept trusted operatives blended into the neighborhood, just in case.\n\n\"Nobody touches the police,\" Chief An ordered firmly. \"Nobody calls any official, and nobody pulls internal files. We do not lift a finger unless the Boss gives the signal. Until then, we watch from the outside and gather only public records. Clear?\"\n\n\"Clear, Chief.\"\n\n\"One more thing.\" Chief An tapped a thin folder his aide had laid on the desk. Across the top page, a title was circled in red ink: Yunxi County, Old Street Rebuilding Project. Clipped to it was a note: Provincial inspection team arrives next Wednesday.\n\nAn old street, a hardware shop, a sudden arrest, and provincial anti-corruption inspectors arriving in five days. All in the same week?\n\nWas that really an accident?\n\nChief An had spent forty years reading men and power, and he didn't believe in accidents.\n\n\"Tell Twenty-three I want public filings on that Old Street project,\" Chief An said quietly. \"The approved relocation budget, the developer's loans, and which county office runs the buyout. Put it on my desk by morning.\"\n\n\"Understood, Chief.\"\n\nThe speaker clicked off. Somewhere fifty minutes down the highway, a hardware shop stood dark and the Boss was riding a bus home for soup. Chief An hoped it was a small matter. After forty years on the job, though, he was already bracing for a storm.\n\nYunxi County Bus Station, 7:05 p.m.\n\nThe bus hissed to a stop, and the familiar hometown air rushed in: fried dough, damp earth, and sweet woodsmoke drifting in from the countryside.\n\n\"Xuan! Over here!\"\n\nAt the edge of the lot, his father, Chen Jianguo, waved wildly beside a battered electric scooter, wearing the same faded gray work jacket from his factory foreman days.\n\n\"Dad, it's a ten-minute walk. You didn't have to come out.\"\n\n\"Nonsense! Your mother kicked me out at six sharp. Get on!\" He shoved a tiny plastic helmet into Xuan's hands. \"I'll tell you on the way.\"\n\nAs the scooter hummed into evening traffic, Chen Xuan asked, \"Dad, what happened?\"\n\nAll the cheer vanished from Chen Jianguo's voice, replaced by raw fury.\n\n\"Two cops marched straight into your uncle's shop and handcuffed him in front of the whole street! Claimed he beat up Hongrui Real Estate's driver! I ran to the police station at three, and they told me, 'Case is under review. Go home and wait.' I told them I'm his older brother, and the smug clerk behind the glass sneered, 'Who do you think you are?' Who do I think I am?! I'm his brother!\"\n\nThe handlebars shook with his anger!\n\n\"And that real-estate boss with the thick gold chain stood outside the shop smiling. Smiling, Xuan!\"\n\n\"I hear you, Dad,\" Chen Xuan said steadily, holding the chin strap of the too-small helmet. \"Did anyone see the driver fall?\"\n\n\"Old Yu the tailor saw everything! Swears your uncle never left his counter. But who's going to listen to an old tailor?\"\n\n\"We'll listen. Let's eat first, Dad. Then we'll know what to ask.\"\n\nChen Jianguo let out half a laugh and half a sigh. \"You sound just like your grandfather.\" He steered into Fuxing New Village, and neither of them said another word.\n"}, {"n": 5, "title": "Home", "raw": "# Chapter 5: Home\n\nFuxing New Village, Building 2, Room 601. Friday, 7:30 p.m.\n\nBy the fourth flight of stairs, Chen Xuan could smell pork-rib soup. Before he could knock, the front door flew open!\n\n\"Xuan!\" His mother, Liu Meifang, hurried out holding a soup ladle, her eyes red. \"You're here! Sit down, sit down! I made pork-rib soup. I didn't touch a bite, waiting for you!\"\n\n\"Mom, I told you to eat first.\"\n\n\"How could I eat while your Second Uncle is locked in a cell?\" Her voice cracked, and she spun back into the kitchen banging pots loudly.\n\nOn the edge of the sofa sat Second Aunt Wu Lanying, clutching a cold glass of water. Always neat, tonight her hair hung loose and her cardigan was buttoned wrong.\n\n\"Xuan,\" she said, standing up with trembling lips. \"Your uncle has never hit anyone in his life. He practically cries killing a fish!\"\n\n\"I know, Second Aunt.\" Chen Xuan gently wrapped her shaking fingers back around the glass. \"Please sit. Let's have some soup first, then tell me everything.\"\n\nIt was a simple gesture, yet her shoulders eased enough to sit down.\n\nSoon the whole family crowded around the folding table. His sharp-tongued sister, Chen Yuan, a junior high school teacher, kept filling Second Aunt's bowl, while his younger brother, Chen Hao, hid behind a high-school math book with one earbud in.\n\n\"Brother, you look like you just woke up,\" Chen Hao muttered.\n\n\"I did. On the bus.\"\n\n\"Classic!\" Chen Yuan snapped. \"Second Uncle is in a cell, and our big brother is napping on the bus!\"\n\n\"Yuan!\" their mother scolded.\n\n\"I'm just saying, Mom. He's the only person alive who could snore through a flood!\"\n\nChen Xuan drank a long spoonful of hot, salty soup, then set the bowl down and listened closely as Second Aunt laid out the whole trap.\n\nYunxi County was knocking down Old Street for a new mall built by Hongrui Real Estate. Hongrui offered 3,800 yuan per square meter, coming out to 456,000 yuan for Second Uncle's 120-square-meter corner shop, when real Old Street shops sold for 8,000 a square meter, nearly one million yuan!\n\nThey called it relocation pay. To put it plainly, it was robbery at less than half price!\n\nEleven owners had already buckled. Only three refused, and Second Uncle's corner lot sat right where the mall's main entrance had to go.\n\n\"For nine days, thugs sat on his stools smoking,\" Second Aunt wept. \"Today the gold-chain boss warned him to sign before something ugly happened. Then that driver threw himself straight into the paint shelf! Old Yu saw it, and the police walked right in like they were waiting outside.\"\n\nClack! Chen Yuan slammed her chopsticks down, her face burning with anger!\n\n\"That's daylight bullying! Tomorrow morning I'm marching straight to that police station myself!\"\n\n\"You're not going anywhere!\" Chen Jianguo barked. \"You're a schoolteacher. One shout in there and they'll ruin your record!\"\n\n\"Then what do we do, Dad?\" Chen Yuan's eyes turned red. \"Just sit here and wait while they break Second Uncle?\"\n\nEvery eye around the table turned slowly toward Chen Xuan.\n\nHe quietly set down his spoon and looked at Second Aunt. \"Don't sign anything tonight, no matter who calls. Tomorrow morning at eight-thirty, Dad and I will go down to the police station, take a queue number like everyone else, and ask them to put their reason in writing.\"\n\nChen Yuan stared at him in total disbelief. \"Take a number at a police station? Brother, did you really bump your head on the bus?\"\n\n\"No,\" Chen Xuan replied mildly, picking up his chopsticks again. \"Their front hall has service windows and a ticket machine that prints queue numbers, just like a bank. You pull a number, wait until your turn flashes on the screen, and talk at the window. Nobody can accuse us of making trouble.\"\n\n\"Xuan, your father already went today!\" Liu Meifang cried anxiously. \"They brushed him right off!\"\n\n\"Then tomorrow we ask for the written detention notice,\" Chen Xuan said calmly. \"By law, they have to give the family a reason in writing. Second Aunt, please promise me one thing. No matter who calls you, don't sign a single sheet of paper. Not for any price.\"\n\n\"But what if they keep him locked up?\" Second Aunt's eyes filled with tears again. \"What if they ruin our daughter's future?\"\n\n\"I'll bring him home,\" Chen Xuan said.\n\nHe spoke as simply as a neighbor predicting clear weather tomorrow.\n\nNobody at the table truly believed he could pull off a miracle. Chen Yuan rolled her eyes, Liu Meifang wiped her cheeks and dropped two more pork ribs into his bowl, and Chen Jianguo cleared his throat with a mumbled proverb about still water running deep. Everyone thought he was just trying to keep Second Aunt from collapsing.\n\nOnly Chen Xuan knew he meant every single word.\n"}, {"n": 6, "title": "The Empty Chair", "raw": "# Chapter 6: The Empty Chair\n\nYunxi County, Fuyuan Garden Restaurant, private banquet room. 9:40 p.m.\n\nBehind closed dark wooden doors, the private room was warm and smelled faintly of high-grade white liquor and tea.\n\nThree men sat around a round table set for four. Nobody glanced at the empty chair.\n\nThat empty seat belonged to Tao Shu, the County Magistrate, head of Yunxi's county government and the second most powerful official in the county. An hour earlier, Tao Shu's aide had called to apologize: the Magistrate had come down with a bad cold and couldn't attend.\n\nAt the head of the table sat Fan Weiguo, Yunxi's County Party Secretary, the true number-one boss who held the final say over every major decision and every official's career in the county. After thirty years in government, Fan Weiguo didn't believe that cold for a second.\n\nTao Shu had wanted his top chair for eight years! Whenever a private dinner smelled like future trouble, Tao Shu conveniently caught a cold and stayed safely home, leaving Fan Weiguo alone at the table if anything ever went wrong.\n\nTo Fan Weiguo's right sat Dong Haisheng, owner of Hongrui Real Estate, who had won the contract to tear down Old Street and build a big new shopping mall. Across from him, sitting stiffly on the front third of his chair with his leather jacket buttoned neat and both hands resting on his knees, was Cheng Biao, Deputy Director of the county police bureau and chief of Old Street Station.\n\nBetween a county's number-one leader and a deputy police director stood three full steps of the government ladder. Cheng Biao didn't even dare touch his chopsticks until the Secretary lifted his.\n\nDong Haisheng stood up first, bending slightly at the waist and holding his small liquor cup in both hands, carefully keeping his rim lower than Fan Weiguo's.\n\n\"Secretary Fan, please allow me to offer a respectful toast,\" Dong Haisheng said, his voice smooth and polite. \"Thanks to the county's steady guidance, eleven Old Street shop owners have already signed their buyout agreements. Only three are left, including that corner hardware shop. Without the corner lot, our builders can't even open the mall's front entrance.\"\n\n\"I'm aware,\" Fan Weiguo said evenly. He raised his teacup half an inch instead of touching his liquor glass. Inside his jacket pocket, his phone lay on silent, and tonight he'd already checked it eleven times.\n\nSeeing the Secretary's tight brow, Cheng Biao straightened his back even further and spoke in the careful, respectful tone of a lower official giving a work report.\n\n\"Secretary Fan, please rest assured,\" Cheng Biao said politely. \"Our station has been helping keep order on Old Street. After patient talks and legal reminders, the first eleven shop owners all understood the bigger picture and agreed to sign. The corner hardware owner was brought in today over a minor fight, and I expect he will agree to sign the buyout contract by Monday.\"\n\nClink.\n\nFan Weiguo set his teacup gently onto its saucer.\n\nThe sound wasn't loud, yet the temperature in the private room dropped twenty degrees in an instant!\n\n\"Eleven,\" Fan Weiguo repeated, his voice quiet and completely flat.\n\nHe didn't raise his volume, and he didn't slam the table. He simply looked across the white tablecloth at Cheng Biao with thirty years of quiet authority behind his eyes.\n\n\"Comrade Cheng Biao,\" Fan Weiguo said softly, \"are you telling me that the county police have been using jail cells to force shop owners into signing business contracts?\"\n\nCold sweat broke out along Cheng Biao's collar! He half-rose from his chair at once, his smooth posture falling apart. \"No, Secretary Fan, never! Every single case started from a real citizen complaint and followed normal police rules!\"\n\n\"Sit down,\" Fan Weiguo said coldly.\n\nCheng Biao dropped back onto the edge of his seat like a scolded schoolboy.\n\nFan Weiguo's gentle expression was gone, replaced by an icy stillness that made even Dong Haisheng's stomach tighten.\n\n\"Listen to me very carefully,\" Fan Weiguo said, every word crisp and calm. \"The provincial inspection team arrives in Yunxi next Wednesday. Five days from tonight.\"\n\nEvery official in the room felt the weight of those words. The provincial inspection team consisted of senior anti-corruption investigators sent straight from the provincial capital, two full levels above the county, to dig for dirty deals and hear citizen complaints. One serious scandal exposed to them could end a thirty-year career in a single afternoon!\n\n\"If even one angry family camps outside the county gate next week,\" Fan Weiguo continued in that same chilling, quiet voice, \"if one old woman breaks down crying in front of those inspectors, I will not be the only person answering questions. Starting tomorrow morning, there will be no more arrests on Old Street. Paperwork only. No pressure, no scenes, nothing an inspector can photograph. Is my order clear?\"\n\n\"Yes, Secretary Fan! Completely clear!\" Cheng Biao answered at once, not daring to meet his eyes.\n\nFan Weiguo leaned back slowly, hiding the hard thud of his pulse behind a calm face.\n\nNeither man across from him knew the real reason his palms were cold tonight: somebody had already sent a secret complaint letter straight to the Governor's office in the provincial capital! Yesterday an old friend up in the province had quietly warned him that leaders above were already asking questions about Old Street.\n\nWho had sent it? One of the three shopkeepers? A reporter? Or Tao Shu, resting comfortably at home with his convenient cold? Fan Weiguo glanced darkly at the empty fourth chair.\n\nWorse still, the low buyout price wasn't even the real time bomb! To make up the difference between Hongrui's 3,800-yuan offer and Old Street's real 8,000-yuan value, the county had set aside a 640-million-yuan relocation fund, and huge chunks of that money had quietly vanished without reaching any family. Fan Weiguo hadn't pocketed a single yuan himself, he was almost certain of that, yet his signature sat on every approval sheet. The man actually holding the purse strings and running the Old Street office was Lu Wenzhe, the Executive Deputy Magistrate who controlled Yunxi's budget.\n\n\"Secretary Fan, please don't worry on our account,\" Dong Haisheng said respectfully, refilling the Secretary's teacup with both hands. \"Hongrui will follow every county order fully. We won't cause a single ripple before Wednesday.\"\n\nOutwardly, Dong Haisheng looked calm and humble. Inside, his stomach burned with fear! He owed Huaxin Bank 1.1 billion yuan, with a loan review hitting on the thirtieth. If construction hadn't started by then, the bank could take everything he owned. Even worse, he'd secretly borrowed another 300 million yuan from a shadowy private lender called Chairman Huang, who'd already phoned three times today, never shouting, only asking gently: \"Is the corner cleared yet, Boss Dong?\"\n\nTrying carefully to ease the heavy silence, Dong Haisheng added in a light, cautious tone, \"Actually, Secretary, I don't expect any trouble from that hardware family. His older brother is just a retired factory worker, and his nephew is an ordinary clerk at a small logistics company in Qingyan City. We heard the nephew is coming back tomorrow morning to ask questions at the station.\"\n\nCheng Biao seized the chance to reassure his boss, offering a restrained, dutiful nod. \"Just a small company clerk, Secretary Fan. We'll receive him politely and handle everything strictly by the book.\"\n\nInside, Cheng Biao sneered. A logistics clerk from the city thought he could walk into Old Street Station and lecture him? They knew exactly how to wear down ordinary clerks!\n\nFan Weiguo didn't answer. He pulled out his phone and stared down at the calendar screen, where next Wednesday at nine o'clock glowed circled in red.\n\nFive days. Thirty years in government, survived by never taking one careless step. Yet tonight, for a reason he couldn't quite name, he felt like a man standing on a frozen river, listening to the ice quietly crack right under his shoes.\n"}, {"n": 7, "title": "Hot Water", "raw": "# Chapter 7: Hot Water\n\nYunxi County, Old Street. Friday, 10:30 p.m.\n\nThe narrow lane lay dark, every storefront shutter pulled tight except two.\n\nAt the far end, under one bare bulb beside an ancient sewing machine, Old Yu sat hemming a trouser cuff by hand after forty-four years on this street.\n\nTonight, his fingers weren't really sewing. They were shaking.\n\nHe couldn't get the sight of Chen Mingde in handcuffs out of his head. He'd stood silent in his doorway while Boss Dong smiled at him, and he felt disgusted with himself! Eleven families had signed. Out of the last three, the toughest one sat in a police cell. Only two remained.\n\nIf Old Chen signs, Old Yu thought bitterly, I have no chance. If he doesn't, they'll come for me next, and who pays my granddaughter's tuition or my wife's heart medicine?\n\nHe sighed, watching the steel needle tremble. Tomorrow, he promised himself. If Old Chen is still in that cell tomorrow night, I'll sign. I'm an old man. Nobody will blame me.\n\nDirectly across the dark street, one other faint yellow light burned.\n\nInside the shuttered steamed-bun stall, Meng Xiaofang sat beside her sleeping four-year-old daughter, her eyes swollen red. In her dented tin box lay eighty-three crumpled yuan for rent, flour, and milk.\n\nIf Old Yu signed, she'd be the very last holdout left, and the last one standing was always the easiest to crush.\n\nNeither neighbor knew what the other had decided. Yet behind two dim windows across the silent lane, two exhausted people made the exact same quiet vow: if Chen Mingde wasn't home by tomorrow night, they were giving up!\n\nYunxi County, Old Street Police Station, holding cell. Friday, 11:00 p.m.\n\nThe holding cell was small and smelled faintly of bleach and damp concrete. Inside sat a hard concrete bench, a tiny barred window high near the ceiling, and a bare bulb that never switched off.\n\nChen Mingde sat on the bench with his back pressed against the wall and his rough hands tucked between his knees. Nobody had given him a blanket. The autumn chill crept straight up through the concrete into his bones.\n\nAcross from him, a heavyset man brought in for a bar fight snored loudly on the opposite bench. He'd spent two nights in this room before, and before rolling over he'd given Chen Mingde some blunt advice: the food was terrible, the blankets were a myth, and the smartest thing to do was sleep.\n\nChen Mingde couldn't sleep.\n\nHe thought of his wife, Wu Lanying, probably sitting stiffly on his brother's sofa clutching a cup of water she wouldn't drink. He thought of his daughter, Xiaoqing, laughing with her roommates in her Wuhan dormitory, completely unaware. He hadn't let anyone call her. Let the girl have one more peaceful night.\n\nAnd against his will, he thought about the 456,000 yuan.\n\nTo be honest, wasn't that a pile of money? He'd never held that much cash in his entire life. If he signed tomorrow morning, he'd walk straight out the front door, and his wife would burst into tears of relief. Who could blame an aging hardware seller for wanting to go home?\n\nYet that little corner shop was twenty-two years of his life! It was opening the rolling shutter at seven every morning and locking it at nine every night. It was every hand-labeled screw drawer, the red-and-white sign he'd painted himself, and every neighbor on Old Street saying, \"Go ask Old Chen, he'll have it.\" If he sold it for less than half its worth, what would he be? Not a hardware man. Not anything.\n\n\"Don't pull back when the fish pulls,\" he whispered softly to the blank wall. \"Wait.\"\n\nSlow, heavy footsteps echoed down the concrete hallway.\n\nThey stopped right outside the iron bars. Chen Mingde looked up and saw a round-faced police officer with red, tired eyes standing there, holding a steaming paper cup.\n\nWei Kun stood silently for several seconds, almost as if he'd forgotten why he walked down here.\n\n\"Uncle,\" he said at last, keeping his voice low enough that the hallway camera couldn't pick it up. \"Would you like some hot water?\"\n\nChen Mingde reached through the bars and took the cup with both hands. It was only plain boiled water, yet the moment the warmth hit his palms, his fingers stopped shaking.\n\n\"Thank you, young man.\"\n\nWei Kun gave one stiff nod without another word and walked briskly back down the hall, moving like a man who'd just broken a rule.\n\nChen Mingde pressed the warm cup against his chest and closed his eyes. He couldn't explain why, yet a quiet certainty settled over him. Somebody was already on the way. His older brother, of course. And right behind his brother, somewhere out there in the night, was the boy who had learned never to yank too hard on a fishing line.\n"}, {"n": 8, "title": "Wait Your Turn", "raw": "# Chapter 8: Wait Your Turn\n\nYunxi County, Old Street Police Station lobby. Saturday, 8:30 a.m.\n\nThe public waiting hall was gray, drafty, and crowded with early errands.\n\nOverhead, blue plastic signs marked the service windows: Family Records, ID Cards, and Case Questions. An old woman sat with a cloth sack of onions balanced on her knees, waiting to fix her family booklet. A young delivery rider paced back and forth arguing into his headset, while a little girl kept sliding down the steel bench despite her grandfather's scolding.\n\n\"Dad, hold this.\" Chen Xuan pulled a thin white paper slip from the ticket machine by the glass doors.\n\nChen Jianguo squinted at the printed digits. \"Thirty-seven.\"\n\nAbove the Case Inquiries window, the red LED screen showed the number currently being served: twelve.\n\n\"Thirty-seven?!\" Chen Jianguo groaned as if reading his own sentence. \"Xuan, by the time they call thirty-seven, your uncle will have a beard down to his waist!\"\n\n\"Then we wait,\" Chen Xuan said easily, sitting down on the steel bench with his scratched green thermos resting on his knee.\n\nBehind the thick service glass, Wei Kun hadn't slept a wink.\n\nHe'd spent the whole night sitting in the duty room with his boots still laced. Every time he shut his eyes, he saw a thin, gray-haired shopkeeper holding a paper cup with both hands. At 7:40 this morning, Director Cheng Biao had stepped into the duty room, his face tight after last night's dinner. \"The nephew is showing up today,\" Cheng Biao had ordered flatly. \"Finish the detention decision paper. Write Friday, 2:30 p.m., right after the arrest.\"\n\nWei Kun had picked up his black gel pen. Then he'd set it back down.\n\nIt was only a date and a time. Yet writing it meant signing a lie on purpose in his own handwriting on an official paper a man's family would hold in their hands. He thought of his pregnant wife at home, who asked him every single night when he walked through the door, \"Was it a good day?\"\n\nSo Wei Kun wrote the true time: Saturday, 7:50 a.m. It was the single honest line on the entire sheet. When Cheng Biao frowned at it, Wei Kun stammered that he'd slipped up and would reprint it right away. He never reprinted it.\n\nIt was the smallest rebellion of his twelve-year career, and he still didn't know why his palms were sweating!\n\nAt 9:50, the red screen chimed and flashed thirty-seven.\n\nThe service counter had the old style of glass barrier with a small speaking grille and a narrow slot at the bottom. Wei Kun looked up from a half-eaten sesame bun and saw a young man with a very mild, calm face.\n\n\"Good morning, Officer,\" Chen Xuan said politely. \"My name is Chen Xuan. My uncle, Chen Mingde, was brought in yesterday at two in the afternoon. We'd like to know the exact charge and when his family can visit him.\"\n\n\"Chen Mingde.\" Wei Kun's fingers tapped across his keyboard while his voice sounded far away. \"Assault and hurting another person. The case is still being checked. He is being held in jail. No visits allowed.\"\n\n\"For how long?\"\n\n\"Ten days, maybe fifteen. Depends on his attitude.\"\n\n\"May we have the written holding notice, please?\"\n\nWei Kun stopped chewing!\n\nIn twelve years behind this window, he'd faced screaming families, weeping mothers, and panicked relatives who tried to kneel on the tile floor. He'd never once seen a young man ask for an official police notice as calmly as someone asking for a bank receipt! Worse, his heart jumped straight into his throat because he knew exactly what was written on that sheet!\n\n\"Who are you, a lawyer?\" Wei Kun forced himself to ask stiffly.\n\n\"No, Officer. I'm an operations supervisor at a logistics company. I check forms every day for work.\"\n\nSomeone waiting in the line behind Chen Xuan let out a sudden snort of laughter!\n\nWei Kun's ears flushed bright red. An office clerk, in front of a crowded lobby, lecturing a veteran officer about paperwork? Yet underneath his embarrassment crept a sharp, cold fear: what if this guy really knew how to read forms? What if he spotted the timestamp right away?\n\n\"Sir, you're holding up the queue,\" Wei Kun said coldly. \"We're busy. We'll mail the family notice.\"\n\n\"By police rules, the station has to tell the family in writing within twenty-four hours, Officer,\" Chen Xuan replied gently, never raising his voice. \"It's been nearly twenty hours already. Could we please take our copy now so we don't have to trouble you again?\"\n\n\"I told you, we'll mail it!\"\n\n\"Then we'll sit right here and wait until you have a moment.\"\n\nChen Xuan turned around and sat calmly back down on the steel bench.\n\nHe didn't shout, didn't bang the glass, and didn't leave. He simply sat beside his fuming father with his green thermos on his knee, looking completely content to wait all morning, leaving Wei Kun utterly stuck!\n\n\"Tch!\" Wei Kun grabbed the desk phone and dialed the inner office. \"Director Cheng? It's Wei. The nephew is here, and he won't leave without the written notice. Yes, Director.\"\n\nTen minutes later, a heavy steel door at the rear of the lobby clicked open.\n\nA broad-shouldered man in a black leather jacket strode out with a wooden toothpick tucked in the corner of his mouth. The moment he stepped into the hall, the chatter dropped to a nervous hush. Even the little girl stopped sliding off the bench.\n\nCheng Biao didn't spare a glance for Chen Jianguo. His eyes swept slowly over Chen Xuan from his plain sneakers to his neat hair, sizing him up with thinly veiled contempt.\n\n\"So you're the logistics clerk,\" Cheng Biao said coolly.\n\n\"Good morning, Director Cheng.\"\n\n\"Hand them the family notice and clear my lobby, Wei.\" Cheng Biao plucked the toothpick from his lips. \"And inform them the detention visiting room is closed this weekend. For pipe repairs.\"\n\n\"Director Cheng,\" Chen Xuan asked politely, \"is the lawyer reception window open on Saturdays?\"\n\nCheng Biao's lip curled in a faint, mocking smile. \"Have you hired a lawyer?\"\n\n\"Not yet.\"\n\n\"Then I suggest you find a very good one.\"\n\nHe turned sharply on his heel and walked back through the heavy steel door, letting it clang shut behind him.\n\nA moment later, a single stamped sheet of white paper slid quietly out through the slot beneath the glass.\n"}, {"n": 9, "title": "Ask Again", "raw": "# Chapter 9: Ask Again\n\nChen Jianguo snatched the stamped sheet from the slot before it finished sliding out. His rough hands shook with anger. \"Look at this, Xuan! Look at the nonsense they wrote!\"\n\nChen Xuan gently took the notice and read it from top to bottom, running his thumb slowly beneath each line.\n\nThe form stated that Chen Mingde was ordered to serve ten days in jail for assault and hurting another person. Down at the bottom, right beside the red station stamp, sat the handwritten line: Time of Decision, Saturday, 7:50 a.m.\n\nChen Xuan paused and read that line a second time.\n\n\"Dad,\" he said quietly. \"They handcuffed Second Uncle at two o'clock yesterday afternoon.\"\n\n\"I know! So what?\"\n\n\"So the formal decision to detain him wasn't signed until 7:50 this morning. That's nearly eighteen hours later. For eighteen hours, they locked him in a cell without a single legal detention order on file.\"\n\nChen Jianguo's mouth opened, then snapped shut in shock!\n\n\"Think about it, Dad,\" Chen Xuan murmured, lowering his voice just enough so only the two of them heard. \"If everyone in that office wanted to hide a dirty arrest, they would've backdated the line to Friday afternoon. Nobody checks twice. Whoever filled out this notice wrote the real time on purpose. That person didn't want to sign a lie.\"\n\nChen Xuan's eyes dropped to the final line listing the supporting evidence: Medical Injury Note, Ankang Private Clinic.\n\n\"And look here, Dad. There's a second problem. In a real assault case, an official police doctor has to examine the injury and write a formal report. They didn't use one. They used a slip from a private street clinic.\"\n\n\"Why does that matter?\" Chen Jianguo asked, blinking fast.\n\n\"Because a private clinic will write whatever someone pays it to write.\"\n\nBehind the glass barrier, Wei Kun froze with the last piece of his sesame bun halfway to his mouth!\n\nHis heart slammed against his ribs! How on earth had an ordinary company clerk spotted both fatal flaws in less than sixty seconds?! Looking at that mild young man standing outside the glass, Wei Kun felt an uncanny chill, as if a stranger had reached straight through the partition, laid a quiet hand on his shoulder, and whispered, *I know what you did.*\n\n\"Xuan, how do you know all this?\" Chen Jianguo stared at his son in stunned disbelief.\n\n\"It's just paperwork, Dad.\"\n\nTo be honest, it really was an everyday skill. In three years auditing shipping bills at Hengxin Logistics, Chen Xuan had inspected more forms than he could count. He knew what an honest paper trail looked like, and he knew what a cooked one looked like. Real records had tiny, messy human quirks; forged ones were always too tidy, and their timestamps always slanted in the same direction.\n\nChen Jianguo's anger flared all over again! He puffed out his chest and took a sharp breath.\n\n\"They forged an arrest on my brother! I'm going to yell right here in this hall until every person in Yunxi hears!\"\n\n\"Dad.\" Chen Xuan laid a gentle, steady hand on his father's sleeve. \"Shouting won't fix a forged form. It'll only give them an excuse to call security.\"\n\n\"Then what will?!\"\n\n\"Let's step outside first. I need to think.\"\n\nThey walked out into the crisp, bright Saturday morning. Chen Jianguo had been ready to shout for an hour, yet somehow, stepping into the cool sunlight beside his calm son, the helpless rage drained right out of his chest.\n\nInside Old Street Police Station, holding cell. 10:20 a.m.\n\n\"Old Chen.\"\n\nChen Mingde blinked awake. With the bare bulb burning nonstop overhead, he'd lost track of whether it was morning or night.\n\nCheng Biao stood outside the iron bars with both hands tucked into his leather jacket pockets. The friendly uncle smile from yesterday was completely gone.\n\n\"Your brother and your nephew stopped by the front lobby this morning,\" Cheng Biao said softly. \"A polite little office clerk asking for written notices. Very cute. Now let me spell reality out for you, Old Chen. They can sit on those lobby benches for a solid week, and they still won't open this iron door. Only you can open it. Say yes to the buyout, sign the line, and walk home.\"\n\n\"My nephew came?\" Chen Mingde asked quietly.\n\n\"That's what I just told you.\"\n\nA slow, steady warmth spread across Chen Mingde's chest. Despite the cold concrete, the empty stomach, and a sleepless night, the corners of his eyes crinkled into a genuine smile.\n\n\"Then I'll keep waiting, Director Cheng.\"\n\nCheng Biao stared through the bars, his brow tightening!\n\nFor the first time since the Old Street buyout began, a thin thread of doubt crept under his skin. Eleven men had cracked when he laid out the math. Why on earth was this nobody, a small-town hardware seller with zero powerful friends, sitting on cold concrete smiling at him?!\n\n\"Suit yourself,\" Cheng Biao muttered coldly, turning down the hallway.\n\nAcross the road from the station, beneath an old locust tree, Chen Xuan pulled out his phone.\n\nHe stared at the dark screen for a long second. He hated dialing this contact. In three years, he'd only used it four times, and each time he felt oddly guilty, like a polite neighbor knocking on someone's door too late at night.\n\nStill, he'd asked once, politely, at the front window, and the answer was crooked. By his grandfather's rule, now it was time to ask again.\n\nHe snapped a clear photo of the stamped detention notice, attached it, and typed slowly with one thumb, phrasing it exactly the way he spoke: *Hello, Chief An. Sorry to bother you on a Saturday. My Second Uncle, Chen Mingde, is being held at Yunxi's Old Street Police Station. The written notice says they decided to detain him at 7:50 this morning, even though they arrested him yesterday at 2:05 p.m., and their injury proof is just a private clinic slip. Something looks very wrong. Could you please check what's really going on? Strictly by the rules, nothing extra. Thank you.*\n\nHe read it once and pressed send.\n\nA reply buzzed back in less than thirty seconds: *Understood, Boss. We'll look into the facts cleanly and report tonight. Please take care of your family.*\n\n\"Okay,\" Chen Xuan murmured, sliding the phone back into his pocket.\n\n\"Who were you texting?\" Chen Jianguo asked curiously.\n\n\"A friend from the city who knows a lot about legal forms.\"\n\n\"Does he know any decent lawyers?\"\n\n\"A few, I think.\"\n\n\"Good, good!\" Chen Jianguo rubbed his rough palms together, suddenly feeling ten pounds lighter. \"Then let's head back first. Your mother's been messaging me every five minutes asking if they locked us up too!\"\n\n\"Hold on, Dad,\" Chen Xuan said, glancing toward the corner where the narrow lane curved toward Old Street. \"Let's grab some fried dough sticks and stop by Old Yu's tailor shop on the way. If we're going to prove Second Uncle didn't touch that driver, we ought to talk to our eyewitness first.\"\n"}, {"n": 10, "title": "Two Witnesses", "raw": "# Chapter 10: Two Witnesses\n\nYunxi County, Old Street, Old Yu's Tailor Shop. Saturday, 10:50 a.m.\n\nThe little tailor shop smelled of steamed wool and hot iron. Chen Xuan set two bags of warm soy milk and fried dough sticks onto the cutting table while Chen Jianguo pulled up a wooden stool.\n\n\"Old Yu, sorry to interrupt your work,\" Chen Xuan said gently. \"Dad told me you saw everything outside my uncle's hardware shop yesterday.\"\n\nOld Yu paused with his iron hovering over a trouser seam, his lined face tightening with guilt. \"Xuan, I really did see it. Your Second Uncle never stepped an inch from behind his counter! That young driver glanced at Boss Dong and threw himself straight into the paint cans. I swear on my granddaughter's name!\"\n\n\"Thank you, Uncle Yu,\" Chen Xuan said calmly, pulling a plain notebook and pen from his canvas bag. \"Would you mind writing down exactly what you saw, with the time and your signature? You don't have to walk into the police station or face Boss Dong. Just keep it quiet for now.\"\n\nOld Yu hesitated, glancing nervously toward the dark street outside. \"Xuan, even if I write it down, who's going to take an old tailor's word against Hongrui Real Estate?\"\n\n\"A piece of paper alone might not move them,\" Chen Xuan replied mildly, glancing out the window toward the small beef-noodle shop angled directly across from Mingde Hardware. Mounted neatly beneath the noodle shop's red awning sat a black security camera pointing straight down the lane. \"Still, when an eyewitness statement matches a security camera and a fake clinic date, people higher up have to look.\"\n\nOld Yu blinked, following Chen Xuan's gaze across the street, and for the first time since yesterday afternoon, a tiny spark of hope lit behind his thick glasses! Picking up the pen, he pressed his shaking hand steady against the table and wrote out every word cleanly.\n\nJust as Chen Xuan folded the signed page into his pocket, his phone buzzed. The caller ID read Manager Hu Dewei.\n\n\"Hello, Manager Hu?\" Chen Xuan stepped onto the quiet sidewalk to take it.\n\n\"Supervisor Chen! Sorry to bother you on a Saturday!\" Hu Dewei's voice sounded oddly flustered over the line. \"I just wanted to check if you got home safely last night. Everything alright in your hometown?\"\n\n\"Everything's fine, Manager. Why, did the port agent call about the refund?\"\n\n\"Oh, yes, they already confirmed the 14,000-yuan error this morning! General Manager Sun was thrilled.\" Hu Dewei coughed awkwardly. \"And don't laugh, but Zhang Pengfei actually drove into the office at eight this morning to check all his own spreadsheets four times over. He looks ready to pull his hair out!\"\n\n\"Tell him to take a break and eat lunch,\" Chen Xuan said politely. \"See you Monday, Manager.\"\n\nHe hung up with a small, amused smile. Sometimes office rivals were almost endearing!\n\nYunxi County, Old Street, Old Beef Noodles. Saturday, 10:40 a.m.\n\nBack on Old Street, directly across the narrow lane from Mingde Hardware, a lean man in a flour-dusted apron stood behind the counter of a steamy little six-table restaur
