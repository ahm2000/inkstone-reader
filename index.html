ant called Old Beef Noodles.\n\nHis name was Gong Yi, Number Twenty-three on Chief An's roster. For nine months he'd blended quietly into Old Street as its ordinary noodle cook, keeping a careful eye on the Boss's hometown while strictly obeying Chief An's stand-down order. A minute ago, his lookout across from the police station had signaled that the Boss had walked out, snapped a photo under the locust tree, and turned toward Old Street with his father.\n\nNow Gong Yi's phone buzzed against his hip. Chief An's message was four words: *The Boss spoke. Check it.*\n\n\"Finally,\" Gong Yi muttered under his breath, wiping noodle broth off his wrist onto a towel.\n\nHe flipped the door sign to Closed for Restock, stepped into the back pantry, and opened a laptop linked to the team's city legal analysts. For two months he'd kept his hands off local affairs, and last night he had only pulled the public project filings Chief An asked for. Now he was finally free to look into the arrests themselves!\n\nWorking strictly from public property records, open business records, and the street-facing security camera mounted beneath his own red awning directly opposite Mingde Hardware, Gong Yi compared the dates.\n\nWithin twenty minutes, a stunning pattern leaped off the screen!\n\nOver the past nine weeks, eleven Old Street shopkeepers had suddenly signed over their storefronts to Hongrui Real Estate at the exact same rock-bottom price, and every single sale had been signed off the very morning after an \"assault\" arrest at Old Street Station! Worse, Ankang Private Clinic wasn't independent at all: its secret main owner was a side company linked straight to Hongrui's business circle!\n\nThen Chief An forwarded the photo Chen Xuan had just snapped of his uncle's holding notice.\n\nGong Yi reached under his counter for two crumpled copies two former Old Street neighbors had angrily shown him over noodles last month before moving away. He laid Chen Mingde's notice side by side with theirs, and his fingers froze!\n\nBoth earlier family notices had been neatly backdated to the exact afternoon of the arrest to hide the illegal overnight lockup. On this twelfth notice alone, the handwritten time sat stark and unchanged: Saturday, 7:50 a.m.\n\n\"Well, look at that,\" Gong Yi whispered, a dry, rare smile tugging at the corner of his mouth. Someone inside that dirty little police station had refused, in the smallest possible way, to sign a lie. And whoever that officer was, he'd just handed them the strongest proof in the entire county!\n"}, {"n": 11, "title": "The Hostage Call", "raw": "# Chapter 11: The Hostage Call\n\nFuxing New Village, Building 2, Room 601. Saturday, 2:00 p.m.\n\n\"Mom, if you stir that soup pot any harder, it's going to file a complaint,\" Chen Yuan sighed from the kitchen doorway.\n\n\"Don't talk to me about complaints!\" Liu Meifang waved her big soup ladle like a general's stick. \"Your uncle's been sitting in a cold cell for twenty-four hours, and I can't even keep my hands steady!\"\n\nThe apartment buzzed with restless family nerves. Behind his bedroom door, Chen Hao groaned loudly every few minutes while losing a battle with a practice math exam. In the living room, Second Aunt sat on the edge of the sofa clutching her phone with both hands, never taking her eyes off the dark screen.\n\nChen Xuan sat at the dining table, quietly comparing the photo of his uncle's detention notice against Old Yu's signed statement, jotting down the timeline in neat rows.\n\nSuddenly, Second Aunt's phone rang!\n\nShe jumped as if the handset had burned her fingers. Instantly, the entire apartment froze!\n\n\"It's him,\" she whispered, her face turning pale. \"It's Boss Dong.\"\n\n\"Don't answer that crook!\" Chen Jianguo shouted.\n\n\"Put it on speaker, Second Aunt,\" Chen Xuan said calmly, setting his pen down. \"Let's hear what he wants.\"\n\nWith trembling fingers, she tapped the green button. A smooth, oily voice filled the quiet living room.\n\n\"Sister Wu? This is Boss Dong. Don't be frightened, I'm only calling to help. Your husband is in a tough spot, you know. Fifteen days of detention isn't a small thing. It leaves a permanent police record, and your daughter's university job hunt will suffer for it. Luckily, I have friends. If you sign the buyout contract today, I'll make one call and have Old Chen home at your dinner table tonight! Four hundred and fifty-six thousand yuan, cash in a week. Think about your family, Sister Wu!\"\n\nSecond Aunt's fingers shook so violently she nearly dropped the phone!\n\nTo put it nicely, Boss Dong was offering a helpful shortcut. To put it bluntly, he was trading her husband's freedom for half the value of their shop! Everybody in the room heard the extortion loud and clear!\n\n\"Four hundred and fifty-six thousand is still money,\" Second Aunt whimpered, tears spilling over her lashes. \"Xuan, maybe I should sign the paper so your uncle can come home tonight.\"\n\n\"Second Aunt.\" Chen Xuan stood up, walked over smoothly, and gently pressed the red hang-up button.\n\nThe living room went dead silent.\n\n\"That shop is worth nearly one million yuan,\" Chen Xuan said steadily, looking straight into her eyes. \"The second you sign, they'll claim Second Uncle agreed freely. Once your name is on that contract, nobody can undo it, not a lawyer, not a judge, nobody. Please trust me and wait one more day. Just one more day.\"\n\n\"Xuan, I want to trust you, I really do,\" Second Aunt sobbed softly. \"But how can you promise he will be home in one day? You are only an office clerk.\"\n\n\"An ordinary logistics clerk, I know.\" Chen Xuan offered her a warm, gentle smile. \"A supervisor, actually. Checking messy forms is literally my job. Their paper has an eighteen-hour legal gap, their injury note came from a shady private clinic, and we already have Old Yu's signed statement. They're the ones who should be nervous, not us.\"\n\nSecond Aunt stared up at him, her breathing slowly steadying.\n\nFor a long beat, nobody spoke. Then Chen Jianguo cleared his throat loudly and lifted one finger into the air. Out of lifelong family habit, everyone turned to hear his pearl of wisdom.\n\n\"As the old proverb says: the fisherman who holds the net isn't afraid of a thrashing carp!\"\n\n\"Dad,\" Chen Yuan groaned, rubbing her temples, \"that is not an old proverb.\"\n\n\"It's a brand-new one,\" Chen Jianguo declared proudly. \"I just invented it!\"\n\nSecond Aunt let out a wet, startled laugh that tumbled straight into a sob, yet it was a real laugh all the same. Liu Meifang hurried over and wrapped her arms tightly around her sister-in-law's shoulders.\n\nYunxi County, a black Audi parked beside the river. 2:15 p.m.\n\nDong Haisheng stared down at his dead phone screen, his smooth face darkening like thunder!\n\nThe woman had hung up on him! Even worse, he'd clearly heard the nephew's calm voice right before the line clicked dead. Eleven signatures were already in his pocket, and now a nobody hardware seller and his stubborn office-clerk nephew were refusing to budge!\n\nBefore he could curse, his phone buzzed again. One name flashed across the screen: Chairman Huang.\n\nDong Haisheng's stomach sank! He swallowed hard and answered at once, his back straightening even inside his own car.\n\n\"Chairman Huang! Good afternoon!\"\n\n\"Boss Dong.\" The voice on the other end sounded mild, almost drowsy, yet every word carried ice. \"I dislike asking the same question twice. Is the corner lot cleared?\"\n\n\"Monday, Chairman! Monday morning, I swear it!\" Dong Haisheng's palm turned slick with sweat against the leather steering wheel. \"The shopkeeper is locked up, and his wife is already breaking down. My friend at the police bureau promised he will sign by Monday!\"\n\n\"I have zero interest in your small-town friends,\" Chairman Huang interrupted softly. \"I know Huaxin Bank reviews your 1.1-billion loan on the thirtieth. And I know exactly what happens to a developer who defaults on the thirtieth. Monday, Boss Dong. Not Tuesday.\"\n\nClick. The line went dead.\n\nDong Haisheng sat frozen behind the wheel, staring across the gray river toward the dark rooftops of Old Street. For the first time in twenty years of wheeling and dealing, cold dread crept into his chest: he had borrowed far more than he could ever survive losing!\n\nYunxi County, the County Magistrate's residence. 8:00 p.m.\n\nTao Shu did not have a cold.\n\nSitting comfortably in his quiet study in soft house slippers with a steaming mug of green tea beside him, the County Magistrate looked completely healthy. Behind his thin-rimmed glasses, his eyes were sharp and wide awake.\n\nFor eight long years as Yunxi's number-two official, Tao Shu had waited patiently for Party Secretary Fan Weiguo to slip up.\n\nTonight, he could smell the mistake in the air the way an old farmer smells coming rain.\n\nYet he hadn't written that secret complaint letter to the provincial capital.\n\nHe'd turned the puzzle over in his head for three straight days. Someone had sent an anonymous tip straight to the Governor's office, and people up in the province were already quietly asking questions. Would Tao Shu have loved to see Fan Weiguo stumble? Of course! Yet he knew better than to write anonymous letters himself. In officialdom, a poison arrow usually cuts the archer's own fingers first.\n\nSo who had sent it? One of the frightened shop owners? Unlikely. A local reporter? No county reporter had the guts. Somebody up in Qingyan City who knew far too much about Yunxi's relocation fund?\n\nTao Shu slid open his desk drawer and lifted out a thin cardboard folder. Written neatly on the cover in his own fountain-pen handwriting sat a single surname: Fan.\n\nHe didn't open it. He simply laid his palm flat across the cover, like a patient hunter keeping a hound quiet in the brush.\n\nNot yet. When river ice is already cracking, a wise man doesn't stomp on it. He waits for it to split all by itself.\n"}, {"n": 12, "title": "Three Options", "raw": "# Chapter 12: Three Options\n\nQingyan City, the quiet eastern courtyard. Saturday, 8:40 p.m.\n\n\"Chief, this is Twenty-three. Everything is checked.\"\n\nChief An Zhiyuan sat upright beneath his brass desk lamp. Beside the encrypted speaker lay a clean sheet of white paper bearing two lines in his neat handwriting: Option One. Option Two.\n\n\"Go ahead, Gong Yi.\"\n\n\"First, the Old Street relocation fund,\" Gong Yi reported crisply, the faint clink of a tea mug sounding in the background of his noodle shop. \"Hongrui Real Estate offered shopkeepers 3,800 yuan per square meter when real Old Street shops sell for 8,000. To cover the gap, Yunxi County approved a 640-million-yuan relocation fund. I traced the public payments and open business records. At least 190 million never went to residents. It flowed into three companies: Hongrui Real Estate, a demolition company registered to Deputy Police Director Cheng Biao's brother-in-law, and Ankang Private Clinic.\"\n\nChief An's pen paused mid-stroke. \"The clinic that wrote the injury note?\"\n\n\"The very same, Chief. Attorney Bai's legal assistant pulled the clinic's patient billing receipt through a normal legal records request: it shows Boss Dong's driver was treated at 1:50 p.m., fifteen minutes before the 2:05 arrest, and no official police doctor ever checked him. Meanwhile, my noodle shop's front street camera across from Mingde Hardware caught the whole stunt: the driver threw himself into the paint shelves while the Boss's uncle never moved from behind his counter.\"\n\n\"Clean proof,\" Chief An murmured approvingly. \"Continue.\"\n\n\"Second, property records show eleven Old Street shopkeepers signed over their shops to Hongrui over the past nine weeks, every single one the morning after an assault arrest signed by Cheng Biao. I compared the Boss's photo against copies kept by two of those former shopkeepers. Their earlier notices were all neatly backdated to hide illegal overnight lockups. Only the Boss's uncle's notice carries a truthful 7:50 a.m. time, written by duty officer Wei Kun. Even better, two off-duty auxiliary cops stopped by my noodle shop for lunch today and grumbled that Wei Kun actually sneaked hot water through the cell bars to the old hardware man last night.\"\n\n\"Hot water,\" Chief An repeated softly, a flicker of genuine warmth crossing his stern face.\n\n\"Third, the political clock,\" Gong Yi finished dryly. \"County Party Secretary Fan Weiguo signed the buyout approvals, though Executive Deputy Magistrate Lu Wenzhe controls the project money. County Magistrate Tao Shu skipped their dinner last night with a fake cold. And the Provincial Inspection Team arrives in Yunxi next Wednesday. Every piece came cleanly from public records, neighbor copies, legal requests, and street video. Nobody knows we're here.\"\n\n\"Well done, Gong Yi. Keep your apron on and wait for my word.\"\n\nChief An clicked the line off and gazed down at his handwritten sheet.\n\nWith forty years behind him, Chief An knew three different ways to end this mess before sunrise. One quiet phone call to a top provincial leader, and Yunxi's county police bureau would be flipped inside out before breakfast! Yet that would be loud, sloppy, and heavy-handed. Worse, turning a local land grab into a political earthquake would crush ordinary shopkeepers and bury one honest beat cop in the rubble.\n\nAbove all, Chief An knew his Boss. Chen Xuan didn't want vengeance. He wanted his uncle treated fairly, strictly under the law.\n\nPicking up his phone, Chief An typed a crisp, clear briefing instead of a bloated essay, laying out the verified facts first, followed by three clean paths.\n\nYunxi County, Fuxing New Village, Building 2, Room 601. 9:20 p.m.\n\n\"Brother, if you stare at your phone any longer, it's going to turn into a brick,\" Chen Hao teased from the far end of the sofa, thumbs flying across a mobile game.\n\n\"Just reading a work note,\" Chen Xuan replied mildly.\n\nIn the kitchen, his mother was scrubbing the same soup bowl for the third time to keep her hands busy. Chen Xuan scrolled calmly through Chief An's short messages.\n\nMessage one laid out the hard proof: the fake 1:50 p.m. clinic slip, the eleven forced buyouts, the 190 million yuan quietly taken from the relocation fund, the street camera video showing the staged fall, and the Provincial Inspection Team arriving Wednesday.\n\nMessage two laid out the choices:\n*Option 1: Our legal team delivers a formal, proof-backed complaint straight to Qingyan's city anti-corruption office tonight (the Municipal Discipline Inspection Commission), with copies to the city prosecutor and city police chief. With provincial inspectors arriving Wednesday, they'll be forced to act within hours. Uncle should be home by dawn.*\n*Option 2: Wait until Wednesday and hand everything to the provincial team directly, leaving Uncle inside three more days.*\n*Option 3: Have a senior leader step in directly tonight. Fastest, but loud and outside normal rules.*\n*We recommend Option 1. Note: Duty officer Wei Kun wrote the true 7:50 a.m. time and brought Uncle hot water last night.*\n\nChen Xuan didn't hesitate for five seconds. He saw the pressure point right away!\n\nWith provincial anti-corruption inspectors arriving in four days, Qingyan's city leaders couldn't dare hide clear, proof-backed wrongdoing, especially when Old Yu's signed eyewitness statement matched the street video and the clinic's impossible 1:50 p.m. time! Clean paperwork aimed right at the inspection deadline would break the whole cover-up open without bending a single rule!\n\nAnd as for duty officer Wei Kun, a quiet cop with nothing to gain had chosen to write one honest time and hand an old man a cup of hot water when nobody was watching. A small, genuine warmth rose in Chen Xuan's chest. Wherever you went in this world, there was always someone quietly doing the right thing, wasn't there?\n\nHe tapped back two short messages with his thumb:\n*Option 1. Add Old Yu's eyewitness statement too. I'll send a photo of it now. Everything strictly by the rules, no shortcuts, nobody hurt.*\n*Also, please send Second Uncle a hot meal and a blanket tonight through the regular station window. He's fifty-two and concrete gets cold. And make sure nobody takes revenge on Officer Wei Kun. He did the right thing.*\n\nHe snapped a clean photo of Old Yu's handwritten statement, sent it off, and set his phone down on the coffee table.\n\n\"Whoa, Brother, why are you smiling like that?\" Chen Hao squinted suspiciously over his phone screen.\n\n\"Am I smiling?\"\n\n\"You look like you just won the lottery!\"\n\n\"Must be Mom's pork-rib soup.\"\n\nBack in the quiet Qingyan courtyard, Chief An read both messages once, then let out a slow breath.\n\nThree options on the table, any one of which could shatter a county's leadership before morning, and what did the Boss spend half his message worrying about? A hot bowl of noodles, a blanket for his uncle, and protecting one honest beat cop!\n\nChief An's throat felt oddly tight, and a rare, gentle smile softened his lined face.\n\n\"Gong Yi,\" he spoke into the speaker, \"cook a big bowl of beef noodles with an extra fried egg, pack a thick clean blanket, and drop them off at the station's family delivery window yourself, still wearing your apron. Strictly by station rules. And pass the word: nobody touches Officer Wei Kun. If anyone tries to blame him, they answer to me.\"\n\n\"Already boiling the broth, Chief,\" Gong Yi replied smoothly.\n\n\"Attorney Bai, please step in.\"\n\nThe study door opened smoothly. Attorney Bai Qingzhou, Number Eleven on the roster, stepped inside wearing a neat dark gray suit and carrying a slim black leather folder. A famous sixty-year-old courtroom lawyer whose name alone made city legal departments sit up straight, Bai Qingzhou looked as pleased as a man walking into his favorite concert hall.\n\n\"Everything is checked and ready, Chief,\" Bai Qingzhou said crisply, tapping the folder. \"Nineteen pages, organized cleanly: the 1:50 p.m. private clinic slip, the honest 7:50 a.m. holding notice, the neighbor's eyewitness statement, the street video showing the staged fall, and the 190-million-yuan fund trail. I'll file it myself at the city Discipline Commission's night complaint desk.\"\n\n\"Through the front door, Bai,\" Chief An reminded him. \"Signed receipt, full legal rules, nothing irregular.\"\n\nBai Qingzhou smiled, his eyes gleaming behind silver-rimmed glasses. \"Naturally, Chief. When the law itself is sharp enough to cut iron, why would anyone bother swinging a club?\"\n"}, {"n": 13, "title": "The Midnight Filing", "raw": "# Chapter 13: The Midnight Filing\n\nQingyan City, Municipal Discipline Inspection Commission, night duty desk. Saturday, 11:40 p.m.\n\nThe Discipline Commission was the city's anti-corruption watchdog, the one office every official feared because it had the authority to investigate anyone in government, no matter how high their title.\n\nTonight, the young clerk on night duty was hunched over a steaming cup of instant noodles, his third this week, expecting nothing more exciting than a quiet shift until sunrise.\n\nFootsteps echoed across the empty marble lobby.\n\nA silver-haired gentleman in a crisp charcoal suit walked up to the counter and placed a thick, neatly indexed folder beside the sign-in ledger. Beside it, he set a plain white business card.\n\n\"Good evening,\" Attorney Bai Qingzhou said politely. \"This is an urgent pre-inspection complaint regarding Yunxi County's Old Street rebuilding project and Deputy Police Director Cheng Biao. Nineteen pages of checked proof, including timed police holding records, clinic logs, eyewitness statements, street video, and relocation-fund payments. I'd like a stamped receipt, please.\"\n\n\"Of course, sir. Give me just a second to log it.\"\n\nThe young clerk glanced down at the business card, and his chopsticks froze in midair!\n\nBai Qingzhou. Even a junior clerk knew that name! Senior partner at one of the province's sharpest law firms, a famous courtroom lawyer who never took a weak case and never filed a single sheet unless the proof was rock solid.\n\nWith suddenly unsteady fingers, the clerk flipped open the cover page.\n\nHis eyes caught four lines printed cleanly right at the top: *Arrest time: 2:05 p.m. Private clinic injury note: 1:50 p.m. (fifteen minutes earlier). Eleven forced shop sales after overnight lockups. 190 million yuan taken from a 640-million-yuan relocation fund. Provincial Inspection Team arrives in Yunxi County on Wednesday.*\n\nThe clerk's face drained of every drop of color!\n\nFour days before provincial anti-corruption inspectors arrived in Yunxi County, a famous senior lawyer had just walked through the front door with video proof of a framed arrest and a 190-million-yuan money trail! If the night desk sat on this until Monday morning and the provincial team found out, every leader in this building would lose their career!\n\n\"Sir, please wait one moment!\" The clerk's voice cracked as he grabbed the red desk telephone, misdialed once with shaking fingers, and punched the number again.\n\n\"Deputy Secretary Lin? It's the night desk! Yes, sir, I know it's almost midnight, please listen! Attorney Bai Qingzhou is standing in front of me with a nineteen-page urgent complaint on Yunxi County's Old Street!\"\n\nOn the other end of the line, Deputy Secretary Lin had picked up half asleep, ready to snap at a nervous rookie. The instant he heard *\"eleven forced arrests,\" \"video of a fake fight,\" \"190 million missing,\"* and *\"Provincial Inspection Team arrives Wednesday,\"* the line went dead silent for three full seconds!\n\n\"Stamp his receipt politely,\" Deputy Secretary Lin's voice came back tight and wide awake. \"Lock the lobby doors behind him, scan every page straight to my secure tablet, and don't breathe a word to anyone in Yunxi! I'm calling the Commission Secretary right now!\"\n\nAcross Qingyan City, lights flicked on in quiet bedrooms one after another.\n\nMinutes after midnight, the Secretary of the Municipal Discipline Commission, one of the top ten leaders running Qingyan City, read the scanned 1:50 p.m. clinic slip and the video stills, his face turning grim as stone. He immediately dialed Qingyan's top police chief, who also served as a Vice Mayor of the city.\n\nAlready in bed, the city police chief sat up so fast he knocked his water glass crashing onto the floorboards!\n\nIn Yunxi County, forty minutes down the highway, County Police Director Mai Zhenhua was jerked awake at 12:20 a.m. by his private mobile vibrating violently on his nightstand. Seeing the city police chief's personal number flashing in the dark, Mai Zhenhua sat bolt upright and answered in a rush.\n\n\"Director! Is there an emergency?\"\n\n\"Mai Zhenhua, listen very carefully,\" the city police chief's voice crackled icy cold through the speaker. \"Your Deputy Director Cheng Biao locked up an Old Street hardware owner named Chen Mingde yesterday using a private clinic note dated fifteen minutes before the arrest. Eleven other shopkeepers signed away their stores after similar holds. The Municipal Discipline Commission already has video of the staged fall on their desk, and provincial inspectors land on Wednesday! If Chen Mingde is still sitting in your holding cell at sunrise, don't bother explaining it to me. Explain it to the provincial team!\"\n\nClick!\n\nMai Zhenhua sat frozen on the edge of his bed in the dark, cold sweat soaking the back of his pajamas. Moments later, in another quiet house across Yunxi County, Party Secretary Fan Weiguo's bedside phone began to ring, the caller ID glowing with four terrifying words: Municipal Discipline Inspection Commission.\n"}, {"n": 14, "title": "The Five A.M. Call", "raw": "# Chapter 14: The Five A.M. Call\n\nYunxi County, Old Street Police Station. Sunday, 5:10 a.m.\n\nThe duty-room desk phone jangled so violently that Wei Kun nearly tumbled off his folding chair!\n\nHe'd dozed off with his uniform boots still laced and half a cold sesame bun resting on his chest. Scrambling upright, he snatched the receiver. \"Old Street Station, duty officer Wei Kun speaking.\"\n\n\"Wei Kun!\"\n\nThe thunderous, flat voice on the line belonged to Mai Zhenhua, Director of the County Police Bureau and also a Deputy County Magistrate, the highest law-enforcement boss in Yunxi County. To a low-level duty officer like Wei Kun, hearing the Director call personally at five in the morning on a Sunday felt like lightning striking the desk!\n\n\"Listen to every word,\" Mai Zhenhua snapped. \"Chen Mingde, the hardware shop owner in your holding cell. Release him immediately! Not after breakfast, not in an hour. Right now! You held a citizen for eighteen hours without a signed detention order, relied on a forged private clinic note dated fifteen minutes before the arrest, and every single Old Street detention paper from the past nine weeks is under investigation by the city Discipline Commission! I am already in my car. If Chen Mingde is still behind bars when I step through your front door, you can trade places with him!\"\n\nThe line clicked dead.\n\nWei Kun sat staring blindly at the humming receiver while the cold sesame bun rolled off his lap and thumped onto the concrete floor.\n\nWhat on earth had happened overnight?!\n\nLast night at ten, a quiet noodle-shop owner in a flour-dusted apron had dropped off a steaming bowl of beef noodles with an extra egg and a thick blanket through the family window, strictly by station rules, while Cheng Biao was out drinking. And now, before sunrise on Sunday, the County Police Director himself was racing down the street in a panic, and the city anti-corruption commission was descending on Yunxi?!\n\nWas it because of the timestamp? His honest 7:50 a.m. timestamp? The one stubbornly truthful line he'd refused to fake?!\n\nAnd suddenly Wei Kun thought of Instructor Qiu Guoqiang and the deputy station chief, both conveniently shipped off to a \"training course\" two weeks ago so nobody would stand in Cheng Biao's way. His chest hammered with a wild tangle of fear and relief!\n\nBy 5:40 a.m., word had already rippled through the waking dormitory upstairs. Three bleary-eyed officers hurried down into the hallway just as the back door banged open and Cheng Biao stormed inside, his leather jacket half buttoned and his face gray with panic.\n\n\"Wei Kun! Who the hell called Director Mai?!\" Cheng Biao barked, his toothpick gone and his swagger shattered. \"Did that office clerk file a complaint?!\"\n\n\"No one called me from Yunxi, Cheng Biao,\" a cold voice cut in from the front doorway.\n\nMai Zhenhua stood there with his coat collar turned up, two stern-faced internal affairs officers flanking his shoulders. \"The city police chief woke me up past midnight, and he sounded ready to tear this whole bureau apart. Effective immediately, you are suspended from duty. Hand your station keys to Wei Kun. Instructor Qiu is returning from his 'training course' this morning, and this station is back under his command!\"\n\nCheng Biao's jaw dropped open, and for the first time in his career, not a single smooth excuse came out!\n\n\"Director Mai, there has to be a misunderstanding! Everything we did on Old Street followed normal police rules!\"\n\n\"Save your excuses for the Municipal Discipline Commission,\" Mai Zhenhua said icily. \"Their investigators will be sitting in our meeting room at nine sharp.\"\n\nDown the hallway, hushed whispers exploded among the watching officers!\n\n\"Did you hear that? Suspended right away!\"\n\n\"The city Discipline Commission is coming at nine?!\"\n\n\"Wait, wasn't that over the quiet hardware shopkeeper from Old Street? Who does that old man know?!\"\n\nCheng Biao stood rooted to the tile floor, cold sweat trickling down his spine.\n\nWho on earth had pulled this trigger?! Chen Mingde was a nobody! His older brother was a retired factory foreman! His nephew was just a mild-mannered logistics supervisor from Qingyan City! Could an ordinary clerk possibly have turned the entire city anti-corruption bureau loose overnight?!\n\nSuddenly, Cheng Biao remembered that calm, polite young man standing outside the service glass yesterday morning, asking mildly, *\"Is the lawyer reception window open on Saturdays?\"*\n\nA sick, hollow dread swallowed Cheng Biao's stomach. His brother-in-law's 38-million-yuan demolition contract. His wife's new villa. Next Wednesday. Everything he'd built over fifteen years had vanished in a single night, like water poured onto dry sand!\n\nAt 6:20 a.m., pale morning light washed across the front steps of Old Street Police Station as Chen Mingde walked slowly out into the cool air, wearing yesterday's jacket and holding a paper cup of hot tea.\n\nCounty Police Director Mai Zhenhua walked him personally to the top of the steps, shook his rough hand firmly with both of his own, and delivered a stiff, formal apology on behalf of the bureau before turning briskly back inside, leaving Cheng Biao standing humiliated behind the glass doors in full view of the waking station. Behind Chen Mingde, the office clerk stammered hurried apologies, and someone had nervously tucked a fresh pack of cigarettes into his coat pocket. Chen Mingde held his tea with fingers that still trembled slightly, blinking in the sunrise.\n\n\"Brother Chen,\" Wei Kun hurried down the steps beside him, bowing stiffly. \"We are truly sorry. This was a terrible mistake on our part.\"\n\n\"Did I win the lottery or something?\" Chen Mingde murmured in a weak, bewildered voice.\n\nThen he paused on the bottom step and turned back to look directly into the round-faced officer's tired eyes.\n\n\"The hot water Friday night,\" Chen Mingde said softly. \"Thank you, young man.\"\n\nWei Kun's eyes stung hotly. He didn't trust his voice to answer. He simply bent from the waist and bowed lower than anyone at Old Street Station had ever seen him bow, holding it in silence until the old shopkeeper walked out into the morning light.\n"}, {"n": 15, "title": "Oh, Nice", "raw": "# Chapter 15: Oh, Nice\n\nYunxi County, Old Street. Sunday, 7:00 a.m.\n\nGood news travels twice as fast as a bus down a narrow lane.\n\nBy seven o'clock, every iron shutter along Old Street had rattled open, and shopkeepers stood clustered on the curb with steamed buns in one hand and buzzing phones in the other.\n\n\"They let him out!\" Meng Xiaofang cried, hurrying across the pavement with her sleepy four-year-old daughter balanced on her hip. \"Old Chen is free! They walked him out at dawn, apologized to his face, and suspended Director Cheng right away! The baker saw the whole thing!\"\n\n\"Are you serious?!\" Old Yu stood frozen in his tailor-shop doorway, still holding a brass thimble on his thumb. He hadn't slept a wink all night. Tucked inside his trouser pocket sat a folded slip of paper he'd written in despair at two in the morning: *I agree to sign.* It had weighed on his chest like a brick.\n\n\"It's true! And city anti-corruption investigators are arriving at nine this morning! Nobody's forcing anyone to sell at half price anymore!\"\n\n\"Thank heavens!\" shouted the grocer two doors down. \"I heard even the eleven families who already signed might get their contracts reviewed!\"\n\n\"Wait, how did Old Chen beat Hongrui Real Estate?! Who helped him?!\"\n\nOld Yu didn't join the guessing. Slowly reaching into his pocket, he pulled out the folded surrender note, stared at his own shaky handwriting for one quiet second, and tore it neatly in half.\n\nThen into quarters. Then into eighths.\n\nLooking down at the fluttering scraps, he realized his hands had stopped shaking. A man who hadn't signed could still look himself in the mirror, and that was worth more than any buyout check in Yunxi County!\n\nFuxing New Village, Building 2, Room 601. 7:30 a.m.\n\n\"Xuan! Wake up, everybody! Your Second Uncle is home!\"\n\nChen Jianguo burst through the apartment door moving faster than his battered electric scooter had ever gone. Right behind him stood Chen Mingde, looking worn out, clutching a neatly folded thick blanket over his arm and blinking dizzily like a traveler who'd just stepped off a train from the moon.\n\n\"Mingde!\" Second Aunt threw her arms straight around his shoulders, bursting into loud, unstoppable tears as the entire household erupted into joyful noise!\n\nChen Xuan was already sitting at the dining table eating a warm red-bean bun. Seeing his uncle standing safely in the doorway, a genuine, relaxed smile lit up his mild face. He finished chewing, swallowed, and nodded happily.\n\n\"Oh, nice,\" he said. \"Just in time for breakfast, Second Uncle.\"\n\n\"That's it?! Just 'Oh, nice'?\" Chen Yuan stared at her brother in frustration while dabbing her own damp eyes. \"Brother, Second Uncle was locked in a cell for two days! Now they let him out at sunrise, the big bad police chief got suspended, and you act like the corner bakery just reopened!\"\n\n\"They actually apologized to me,\" Chen Mingde murmured, still gazing around the bright living room in disbelief. \"County Police Director Mai shook my hand himself! And Director Cheng, the tough one who threatened me yesterday, got sent packing right in front of everybody. They even poured me hot tea on my way out!\"\n\n\"Someone up in heaven must've answered our prayers!\" Chen Jianguo declared, beaming from ear to ear.\n\n\"Or maybe it was that 'friend who knows legal forms' Brother texted yesterday,\" Chen Yuan said, narrowing her eyes playfully at Chen Xuan.\n\n\"Nah, I bet it was my brother's magic 'Oh, nice,'\" Chen Hao grinned from his bedroom doorway, hair sticking straight up. \"Say it again, Brother, maybe my math exam will pass itself!\"\n\nEveryone burst out laughing, even Second Aunt, who was laughing and wiping fresh tears at the exact same time.\n\n\"Oh, and the noodles!\" Chen Mingde suddenly remembered, lifting the folded blanket. \"Last night around ten, somebody sent a steaming bowl of beef noodles with an extra fried egg and this thick blanket through the detention window! Best bowl of noodles I've eaten in my life! Sister-in-law, was that you?\"\n\n\"Me?!\" Liu Meifang put both hands on her hips. \"I was pacing this kitchen all night! How would I sneak beef noodles into a police station?\"\n\n\"Maybe the station has a nicer night kitchen than people think,\" Chen Xuan said calmly, taking another bite of his bun.\n\nTo be honest, watching his uncle sit safely at the table while his mother clattered bowls in the kitchen made his chest feel warmer than any big speech ever could. He'd asked politely, sent clean proof through the proper door, and the answer had come out fair. That was all he'd ever wanted!\n\n\"Alright, no more sitting around!\" Liu Meifang announced briskly, tying on her cleanest apron. \"We're heading out to the village early! Grandpa and Grandma have been burning incense and worrying themselves sick for two days. They need to see Mingde with their own eyes before lunch!\"\n\nHongshi Village, Dongqiao Town. 9:00 a.m.\n\nTucked at the foot of a green ridge twenty minutes outside the county seat, Hongshi Village had one paved lane, two tiny grocery stalls, and an old irrigation reservoir older than anyone in the family could remember.\n\n\"Too thin!\" Grandmother Zhou Guilan declared the exact second Chen Xuan stepped through the courtyard gate.\n\nBarely reaching his shoulder, the eighty-year-old grandmother pressed a warm pickled egg into his palm before he could even say hello. Beside the gate, Grandfather Chen Fugen stood tall and straight under a faded straw hat, looking over his younger son Chen Mingde once from head to toe, then giving one satisfied nod as if the world had finally remembered its manners.\n\n\"Good, everybody's safe,\" Grandfather said gruffly. \"Let the women talk in the yard. Xuan, grab the rods. The carp are biting early today.\"\n\nBy 9:30 a.m., they had settled along the quiet sandy edge of Qingshan Reservoir, where green water lapped gently against tall reeds. Chen Xuan unfolded a tiny canvas stool, cast his line lazily into the water, and leaned back with his eyes half closed in the warm autumn sunshine.\n\nTen feet down the bank, another fisherman was already sitting on a folding stool.\n\nHe looked to be in his mid-seventies, dressed in a faded gray cap and an old canvas vest with far too many pockets, yet his spine stayed straight as a wooden ruler. He gripped a plain bamboo rod and stared down at his red-and-white float with fierce, steady focus.\n\n\"Young man, your float is dead,\" the old gentleman remarked without turning his head.\n\n\"It's resting,\" Chen Xuan replied mildly.\n\n\"A fishing float doesn't rest. You're resting. Your float is dead.\"\n\n\"Mm,\" Chen Xuan agreed politely, and left his float right where it was.\n\nThe old man let out an amused snort. A moment later, he patted his vest pockets one by one, frowned, and glanced sideways at Chen Xuan.\n\n\"Young man, do you happen to have ten yuan in cash? The village auntie at the gate collects ten yuan for a day fishing ticket, and I walked out without my wallet again.\"\n\n\"Sure.\" Without even opening his eyes fully, Chen Xuan fished a crisp ten-yuan bill from his jacket and handed it over.\n\n\"Thank you. I'll pay you back,\" the old man said, tucking the bill neatly into his vest. Gazing out across the green reservoir, he added casually, \"Anhe County upstream caught a heavy downpour last night. Water level here is going to climb nicely by Tuesday.\"\n\n\"You follow upstream rain reports?\" Chen Xuan asked idly.\n\n\"Old habit. I read.\"\n\nBeside Chen Xuan, Grandfather Chen Fugen leaned over and lowered his voice. \"That's Old Zhao. Been staying at the village guesthouse for three weeks on a quiet vacation. Used to work inspecting reservoirs and flood-control ditches across Lanshui Province before he retired, something like that. Never remembers his wallet and never catches a single carp, yet every auntie in the village brings him boiled peanuts!\"\n\n\"Mm,\" Chen Xuan murmured contentedly.\n\nHe thought nothing more of it. The autumn sun warmed his face, the reeds smelled sweet, and Grandmother had insisted on tucking a thick wool shawl over his knees before they left the yard. His float didn't twitch once for over an hour, and he couldn't have been happier!\n\nTen feet away, Old Zhao's float didn't move either. Yet the old gentleman wasn't watching the water anymore. Through narrowed, thoughtful eyes, he studied the completely calm young man dozing beside him in the sun. For one brief second, a look of sharp, genuine liking crossed his lined face, before he quietly reached into his vest pocket for his phone.\n"}, {"n": 16, "title": "The Old Gentleman", "raw": "# Chapter 16: The Old Gentleman\n\nQingyan City, Provincial Discipline Inspection Commission, Inspection Team office. Sunday, 11:10 a.m.\n\nVice Director Gao Zhengyi was zipping up his leather briefcase for a quick lunch when his private mobile phone rang on his desk. As one of the senior deputy directors overseeing the province's anti-corruption inspection teams, he fielded high-level calls every single day.\n\nStill, the caller ID glowing on his screen was a number that hadn't dialed him in three full years.\n\nInstinctively, Gao Zhengyi straightened his coat and stood up behind his desk before pressing answer, even though he was completely alone in the room.\n\n\"Hello, sir!\"\n\n\"Gao,\" an old, dry, calm voice came across the line. \"I'm down in Yunxi County doing a little fishing by Qingshan Reservoir. Very quiet spot. There's a young man sitting beside me who hasn't caught a single fish in nearly two hours, and he doesn't look the slightest bit impatient. It's been a long time since I sat next to someone like that.\"\n\n\"Sir,\" Gao Zhengyi answered respectfully, his throat tightening slightly. \"It's truly wonderful to hear you're enjoying your rest.\"\n\n\"Your inspection team is scheduled to arrive in Yunxi on Wednesday, isn't it?\" The old gentleman paused, the faint sound of lapping water drifting through the phone. \"Move it up. Come tomorrow morning instead. I'd like to see what a county looks like when it hasn't had three extra days to clean up its act and hide its account books for the Governor. And Gao, do everything strictly by the book. No fuss.\"\n\n\"Yes, sir! Tomorrow morning, nine sharp, strictly by the rules!\"\n\nThe line clicked softly dead.\n\nGao Zhengyi stood motionless behind his desk for a long ten seconds, still gripping the silent phone.\n\nThat old gentleman had retired from the very top of Lanshui Province eleven years ago, yet for a solid decade before that, every city and county leader in the province had trembled at a single margin note in his handwriting! If he'd quietly picked a small county reservoir for a three-week fishing stay and suddenly ordered the inspection team in two days early, then Yunxi County's sky was about to fall straight onto somebody's head!\n\nSetting his briefcase aside, Gao Zhengyi reached straight for his office landline and began rearranging his entire team's schedule at top speed!\n\nYunxi County Government, Office of the Party Secretary. Sunday, 11:20 a.m.\n\nFan Weiguo hadn't slept a wink in over thirty hours.\n\nBeneath his neatly pressed suit jacket, his white dress shirt clung damply to his back. He sat stiffly behind his wide dark wooden desk with both palms pressed flat against the glass tabletop so nobody walking in could see his fingers tremble.\n\nAt seven o'clock this morning, Qingyan's City Party Secretary, Fan Weiguo's direct superior and the top leader of the entire city, had called him personally. The news had hit like three consecutive thunderbolts! Deputy Police Director Cheng Biao was suspended. Every Old Street buyout deadline was frozen, along with the county's 640-million-yuan relocation fund. All eleven previously signed contracts were being pulled for independent legal review. Worse, three investigators from the Municipal Discipline Commission were already sitting in Yunxi County, with a fourth on the highway!\n\nBefore hanging up, the City Party Secretary had left Fan Weiguo with one chilling sentence in a voice he'd never heard from his boss before: \"Weiguo, I trust you'll cooperate with the investigators. Fully.\"\n\nWho had triggered this avalanche?! Who had walked straight into Qingyan's Discipline Commission at midnight with the clinic timestamp, video proof, and bank records?! For four agonizing hours, Fan Weiguo had racked his brain. All roads seemed to start at an ordinary hardware shopkeeper and his logistics-clerk nephew, yet that made no sense at all!\n\nWas it linked to that secret complaint letter sent to the Governor's office? Had somebody inside his own county staff leaked the relocation-fund ledgers? Or had County Magistrate Tao Shu, who'd so neatly dodged Friday's dinner with his fake cold, finally opened his drawer?!\n\nBrrring!\n\nHis red office landline shattered the silence, making Fan Weiguo's shoulders jerk! Taking a sharp breath to steady his voice, he lifted the receiver. \"Fan Weiguo speaking.\"\n\n\"Secretary Fan?\" The caller's tone was crisp, polite, and unmistakably official. \"I'm calling from the General Office of the Provincial Party Committee. Please do not take notes on this call. Today and tomorrow, a retired senior leader is visiting Qingshan Reservoir in your county privately to fish. There is to be no welcome committee, no security escort, no ID checks, no photographs, and zero questions. Nobody from Yunxi is to approach him, ask his name, or reveal that we called.\"\n\nFan Weiguo's breath caught in his chest! The General Office of the Provincial Party Committee was the nerve center of the entire province's highest leadership!\n\n\"I understand completely,\" Fan Weiguo answered, keeping his voice careful and polite. \"May I ask which senior leader is visiting?\"\n\n\"Secretary Fan,\" the caller cut in smoothly. \"When the City Party Secretary walks into your office, how do you stand?\"\n\n\"I stand up immediately, of course. Straight at attention.\"\n\n\"For this gentleman, the Provincial Party Secretary stands straight.\" There was one quiet, heavy beat on the line. \"If anything spoils the old gentleman's weekend, you won't need to bother coming into work on Monday. That is all.\"\n\nClick.\n\nFan Weiguo sat frozen with the dead phone pressed against his ear, feeling all the blood drain from his face!\n\nSomeone for whom the top leader of the entire province stood straight at attention! How many living people in Lanshui Province fit that description?! Four? Five at most! All retired, all famous, and one of them, Fan Weiguo remembered with a sickening drop in his stomach, had famously loved quiet reservoir fishing!\n\nRight here at Yunxi's Qingshan Reservoir. This exact weekend. Hours after the Old Street scandal exploded in Qingyan City!\n\nCould that possibly be a coincidence?! Had the old gentleman heard about Old Street? Did he somehow know that hardware shopkeeper?! Wait, did Chen Mingde's family secretly have a huge backer in the provincial capital?!\n\nFan Weiguo cut off that thought right away! Even finishing that guess felt dangerous!\n\nBang! His office door burst open without a knock, and his young aide rushed in, white-faced and gasping for breath.\n\n\"Secretary Fan! Bad news! The Provincial Inspection Team just phoned the general office! They canceled Wednesday; they're arriving in Yunxi tomorrow morning at nine o'clock sharp!\"\n\nFan Weiguo didn't even blink. Slowly cradling the silent landline, he stared at the open doorway as if waiting for the ceiling itself to collapse next. After   var wc=chapters.reduce(function(a,c){return a+c.words},0);
  box.innerHTML='<div class="dhead" style="padding:0 0 10px"><h3>Library</h3><button class="xbtn" id="libX">&times;</button></div>'+
    (S.inLibrary?('<div class="lib"><div class="cover">RS</div><div style="flex:1"><h4>'+esc(NOVEL.title)+'</h4><p>'+chapters.length+' chapters &middot; '+wc.toLocaleString()+' words &middot; reading Ch. '+chapters[S.chIndex].n+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row gap"><button class="btn sm" id="libCont">Continue reading</button><button class="btn sm" id="libImp">Import chapters</button><button class="btn sm" id="libRem">Remove</button></div></div></div>'):
    '<p class="hint">Your library is empty.</p><button class="btn pri" id="libAdd">Add "'+esc(NOVEL.title)+'" to library</button>');
  $('#libModal').classList.remove('hidden');
  $('#libX').onclick=function(){$('#libModal').classList.add('hidden')};
  var c=$('#libCont');if(c)c.onclick=function(){$('#libModal').classList.add('hidden')};
  var i=$('#libImp');if(i)i.onclick=function(){$('#fileIn').click()};
  var r=$('#libRem');if(r)r.onclick=function(){S.inLibrary=false;saveState();openLibrary();renderDock()};
  var a=$('#libAdd');if(a)a.onclick=function(){S.inLibrary=true;saveState();openLibrary();renderDock()};
}
function importFiles(files){
  var list=Array.prototype.slice.call(files),done=0,added=0;
  if(!list.length)return;
  list.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      var raw=String(rd.result||''),p=parseTitle(raw);
      if(p){imported[p.n]=raw;added++}
      if(++done===list.length){save('imported',imported);buildChapters();renderToc();renderChapter(S.chIndex,false);toast(added?('Imported '+added+' chapter'+(added>1?'s':'')):'No "# Chapter N: Title" heading found');}
    };rd.readAsText(f);
  });
}

/* ---------- misc ---------- */
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}
function dlChapter(){
  var c=chapters[S.chIndex],blob=new Blob([c.raw],{type:'text/markdown'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='Chapter_'+(c.n<10?'00':c.n<100?'0':'')+c.n+'.md';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Chapter downloaded');
}
function stepFont(d){S.fontSize=Math.max(14,Math.min(44,S.fontSize+d));applyLook();saveState();renderDock()}
function stepLH(d){S.lineH=Math.max(1.2,Math.min(2.5,Math.round((S.lineH+d)*10)/10));applyLook();saveState();renderDock()}

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a&&t.closest('#menuDrawer,#userMenu')){closeDrawers();closeTop()}
  if(a==='home'){}
  else if(a==='imp')$('#fileIn').click();
  else if(a==='exp')exportTerms();
  else if(a==='dl')dlChapter();
  else if(a==='disp'){showDock();setDock('display')}
  else if(a==='set'){showDock();setDock('settings')}
  else if(a==='prev')go(-1);else if(a==='next')go(1);else if(a==='toc'){renderToc();openDrawer('tocDrawer')}
  else if(a==='terms')openTerms('editor',null);else if(a==='adv')openTerms('config',null);
  else if(a==='lib')openLibrary();else if(a==='addlib'){S.inLibrary=!S.inLibrary;saveState();renderDock();toast(S.inLibrary?'Added to library':'Removed from library')}
  else if(a==='fs-')stepFont(-1);else if(a==='fs+')stepFont(1);else if(a==='lh-')stepLH(-.1);else if(a==='lh+')stepLH(.1);else if(a==='lh0'){S.lineH=DEF.lineH;applyLook();saveState();renderDock()}
  else if(a==='reset'){['font','fontSize','lineH','termColors','readerTheme','siteTheme','readerType','termStyle','sysColored','userColored','patchColored','align','paraSpace','indent','width','showHeading'].forEach(function(k){S[k]=DEF[k]});saveState();applyLook();renderChapter(S.chIndex,false);renderDock();toast('Display settings reset')}
  var d=t.getAttribute('data-font');if(d){S.font=d;applyLook();saveState();renderDock()}
  d=t.getAttribute('data-tcol');if(d){S.termColors=d==='on';applyLook();saveState();renderDock()}
  d=t.getAttribute('data-svc');if(d){S.service=d;saveState();applyLook();renderChapter(S.chIndex,false);renderDock()}
  d=t.getAttribute('data-site');if(d){S.siteTheme=d;saveState();applyLook();renderDock();
    if($('#menuDrawer').classList.contains('open'))renderMenu();
    if(!$('#userMenu').classList.contains('hidden')){$('#userMenu').classList.add('hidden');toggleUser()}}
  d=t.getAttribute('data-rt');if(d){S.readerTheme=d;saveState();applyLook();renderDock()}
  d=t.getAttribute('data-rtype');if(d){S.readerType=d;saveState();applyLook();renderChapter(S.chIndex,false);renderDock()}
  var c=t.getAttribute('data-close');if(c)closeDrawers();
});
document.addEventListener('change',function(e){if(e.target.id==='swAuto'){S.autosave=e.target.checked;if(S.autosave)saveState();else try{localStorage.removeItem(LS+'state')}catch(x){}}});
$('#prevTop').onclick=$('#prevBot').onclick=function(){go(-1)};
$('#nextTop').onclick=$('#nextBot').onclick=function(){go(1)};
$('#svcTop').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return});
$('#dockTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setDock(b.getAttribute('data-tab'))});
/* click the page to show the panel, click the page again to hide it */
document.addEventListener('click',function(e){
  var term=e.target.closest('#chBody .term');
  if(term){openPopover(term);return}
  if(!e.target.closest('#tpop'))closePopover();
  if(!e.target.closest('#userMenu,#btnUser')&&!$('#userMenu').classList.contains('hidden'))closeTop();
  if(e.target.closest('button,a,input,select,textarea,label,#dock,.drawer,.modal,#addTermBtn,.top,#scrim,#tpop,#userMenu,#searchRes'))return;
  if(String(window.getSelection()).trim())return;
  if($$('.drawer.open').length||!$('#libModal').classList.contains('hidden'))return;
  if($('#dock').classList.contains('hidden'))showDock();else hideDock();
});
$('#termTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tTab=b.getAttribute('data-tt');if(tTab==='config'){cfg=Object.assign({},S)}renderTerms()});
$('#scrim').onclick=closeDrawers;
$('#novelName').onclick=openLibrary;
$('#btnLibrary').onclick=function(){closeTop();openLibrary()};
$('#btnMenu').onclick=openMenu;
$('#btnSearch').onclick=openSearch;
$('#btnUser').onclick=toggleUser;
$('#sBack').onclick=closeSearch;
$('#sInput').oninput=function(){runSearch(this.value)};
$('#searchRes').addEventListener('click',function(e){var b=e.target.closest('[data-si]');if(!b)return;var i=+b.getAttribute('data-si');closeSearch();renderChapter(i)});
$('#gripBtn').onclick=hideDock;
window.addEventListener('resize',fitDock);
$('#libModal').addEventListener('click',function(e){if(e.target.id==='libModal')$('#libModal').classList.add('hidden')});
$('#fileIn').onchange=function(){importFiles(this.files);this.value=''};
$('#termIn').onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;var n=0;arr.forEach(function(t){if(t&&t.from){terms.unshift({id:'t'+Date.now()+n,from:String(t.from),to:String(t.to||''),cs:!!t.cs,novel:!!t.novel});n++}});save('terms',terms);renderChapter(S.chIndex,false);renderTerms();toast('Imported '+n+' terms')}catch(x){toast('That file is not a terms export')}};
  rd.readAsText(f);this.value='';
};
$('#addTermBtn').addEventListener('mousedown',function(e){e.preventDefault()});
$('#addTermBtn').addEventListener('click',function(){var s=String(window.getSelection()).trim().slice(0,128);if(s){openTerms('editor',s)}this.classList.add('hidden')});
var selT;document.addEventListener('selectionchange',function(){clearTimeout(selT);selT=setTimeout(function(){
  var sel=window.getSelection(),txt=sel?String(sel).trim():'',btn=$('#addTermBtn');
  if(txt&&txt.length<=128&&sel.rangeCount&&$('#chBody').contains(sel.getRangeAt(0).commonAncestorContainer)){btn.classList.remove('hidden');placeAddBtn(sel.getRangeAt(0),btn)}else btn.classList.add('hidden');
},180)});
/* the Add Term button follows the selected words (above them, or below if there is no room) */
function placeAddBtn(range,btn){
  var r=range.getBoundingClientRect(),bw=btn.offsetWidth||100,bh=btn.offsetHeight||36;
  var top=r.top-bh-10;if(top<64)top=r.bottom+10;
  var left=r.left+r.width/2-bw/2;left=Math.max(8,Math.min(left,document.documentElement.clientWidth-bw-8));
  btn.style.top=(top+window.scrollY)+'px';btn.style.left=(left+window.scrollX)+'px';
}
var scT;window.addEventListener('scroll',function(){infiniteTick();clearTimeout(scT);scT=setTimeout(persist,400)},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePopover();closeDrawers();closeTop();hideDock();$('#libModal').classList.add('hidden');return}
  var id=(e.target||{}).id;
  if(e.key==='Enter'&&(id==='edFrom'||id==='edTo')){e.preventDefault();saveTermFlow();return}
  if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
});

/* ---------- boot ---------- */
if(!NOVEL||!NOVEL.chapters){document.body.innerHTML='<p style="padding:30px">No chapters embedded. Run build_inkstone.py.</p>'}
else{
  fillIcons();buildChapters();applyLook();renderToc();renderChapter(S.chIndex,false);
  if(S.autosave&&S.scrollY)window.scrollTo(0,S.scrollY);
  renderDock();
}
})();
</script>
</body>
</html>
