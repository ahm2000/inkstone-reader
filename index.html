<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inkstone Reader</title>
<meta name="theme-color" content="#23252a">
<style>
/* ---- one theme control: five themes colour the page AND the app (set by data-theme on <html>) ---- */
:root{
  --pg-bg:#1c1e22; --pg-fg:#e6e7ea; --pg-card:#17181b; --pg-line:#33363c; --pg-mute:#a0a3aa;
  --ui-bg:#23252a; --ui-card:#1a1b1f; --ui-line:#3a3d44; --ui-field:#2d3036; --ui-accent:#6cb0ff; --on-accent:#0b1b2e;
  --ui-fg:var(--pg-fg); --ui-mute:var(--pg-mute);
  --c-sys:#6cb3ff; --c-user:#8cbcff; --c-patch:#e7c26b; --danger:#ff8a97; --brk:#6cb0ff;
  --fs:22px; --lh:1.5; --ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --pgap:.45em; --maxw:760px;
  --head-align:left; --head-ml:0; color-scheme:dark;
}
html[data-theme="light"]{
  --pg-bg:#f8f7f3; --pg-fg:#1c1d20; --pg-card:#ffffff; --pg-line:#dedcd4; --pg-mute:#5a5d64;
  --ui-bg:#efeee9; --ui-card:#ffffff; --ui-line:#d3d1c8; --ui-field:#e4e3dc; --ui-accent:#1a56b0; --on-accent:#ffffff;
  --c-sys:#15509a; --c-user:#15509a; --c-patch:#7a4e00; --danger:#b3261e; --brk:#1a56b0;
  --head-align:center; --head-ml:auto; color-scheme:light;
}
html[data-theme="sepia"]{
  --pg-bg:#f3e9d2; --pg-fg:#392d20; --pg-card:#f9f1de; --pg-line:#dac9a6; --pg-mute:#65533d;
  --ui-bg:#eadfc4; --ui-card:#f6eed9; --ui-line:#d1c19b; --ui-field:#e0d3b2; --ui-accent:#8a4a0e; --on-accent:#fff7e8;
  --c-sys:#15509a; --c-user:#15509a; --c-patch:#7a4e00; --danger:#a8281f; --brk:#8a4a0e;
  --head-align:center; --head-ml:auto; color-scheme:light;
}
html[data-theme="midnight"]{
  --pg-bg:#0e1526; --pg-fg:#dde5f6; --pg-card:#0a101d; --pg-line:#26334f; --pg-mute:#95a3c2;
  --ui-bg:#141d33; --ui-card:#0b1222; --ui-line:#2b3a5c; --ui-field:#1c2745; --ui-accent:#7db4ff; --on-accent:#07142b;
  --c-sys:#78b4ff; --c-user:#9cc4ff; --c-patch:#e7c26b; --danger:#ff8a97; --brk:#7db4ff;
}
html[data-theme="forest"]{
  --pg-bg:#141f19; --pg-fg:#dde9df; --pg-card:#0f1812; --pg-line:#2c4034; --pg-mute:#9ab0a1;
  --ui-bg:#1a2921; --ui-card:#111c16; --ui-line:#34503f; --ui-field:#22352a; --ui-accent:#82d29f; --on-accent:#06200f;
  --c-sys:#7ebcff; --c-user:#9ccaff; --c-patch:#e7c26b; --danger:#ff8a97; --brk:#82d29f;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--pg-bg);color:var(--pg-fg);font-family:system-ui,Segoe UI,sans-serif;min-height:100vh;padding-bottom:0}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top header */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ui-bg);border-bottom:1px solid var(--ui-line);color:var(--ui-fg);position:sticky;top:0;z-index:30}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto;font-size:16px}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--ui-mute);padding:6px 10px;border-radius:8px;font-size:14px}
.tbtn:hover{color:var(--ui-fg);background:var(--ui-field)}
.tbtn.sq{border:1px solid var(--ui-line);color:var(--ui-fg);padding:6px 9px}

/* reader cards */
#reader{max-width:var(--maxw);margin:14px auto 0;padding:0 12px}
body[data-width="narrow"]{--maxw:620px} body[data-width="wide"]{--maxw:940px}
.card{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.novelname{color:var(--pg-mute);font-size:14px;cursor:pointer}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nbtn{background:var(--pg-bg);border:1px solid var(--pg-line);color:var(--pg-fg);padding:7px 14px;border-radius:8px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nbtn:hover:not(:disabled){border-color:var(--ui-accent)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.navmid{text-align:center;font-size:14px;line-height:1.3}
.navmid b{font-weight:600}
.navmid span{display:block;color:var(--pg-mute);font-size:13px}
.seg{display:flex;border:1px solid var(--pg-line);border-radius:8px;overflow:hidden;margin-top:10px}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--pg-line);padding:7px 6px;font-size:14px;color:var(--pg-fg)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pg-bg);box-shadow:inset 0 -2px 0 var(--ui-accent)}
.chtitle{font-size:20px;margin:4px 0 0}
.chtitle b{margin-right:6px}
.chipline{display:flex;align-items:center;margin:10px 0 6px}
.chipline:before,.chipline:after{content:"";flex:1;border-top:1px solid var(--pg-line)}
.chip{font-size:12px;border:1px solid var(--pg-line);background:var(--pg-bg);border-radius:8px;padding:3px 10px;margin:0 8px;color:var(--pg-fg)}

/* chapter text */
#chBody{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:left}
body[data-align="justify"] #chBody{text-align:justify}
body[data-pspace="compact"] #chBody{--pgap:.2em} body[data-pspace="wide"] #chBody{--pgap:.9em}
#chBody p{margin:0 0 var(--pgap)}
body[data-indent="on"] #chBody p{text-indent:1.6em}
#chBody .chsec + .chsec{margin-top:2.4em;padding-top:1.6em;border-top:1px dashed var(--pg-line)}
.term{border-radius:3px}
body[data-tstyle="semi"] .term{font-weight:600} body[data-tstyle="bold"] .term{font-weight:700}
body[data-tstyle="underline"] .term{text-decoration:underline;text-underline-offset:3px}
body[data-tstyle="italic"] .term{font-style:italic}
body.tc-on.tc-sys .t-sys{color:var(--c-sys)} body.tc-on.tc-user .t-user{color:var(--c-user)} body.tc-on.tc-patch .t-patch{color:var(--c-patch)}
body.old #reader .card{background:transparent;border-color:transparent;padding-left:0;padding-right:0}
body.old #chBody{font-family:Georgia,'Times New Roman',serif;text-align:justify}
.endnav{display:flex;gap:10px;justify-content:space-between;margin:26px 0 8px}
.sentinel{height:1px}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;align-items:center;pointer-events:none;border-top:1px solid var(--ui-line)}
#dock>*{pointer-events:auto}
#dockPanel{width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-top:0;border-bottom:0;border-radius:0;padding:8px 10px;max-height:56vh;overflow:auto}
#dockTabs{width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);display:flex;background:var(--ui-card);border:1px solid var(--ui-line);border-top:0;border-bottom:0;color:var(--ui-mute)}
#dockTabs button{flex:1;background:transparent;border:0;border-top:2px solid transparent;padding:5px 4px 6px;font-size:12px;color:var(--ui-mute);display:flex;flex-direction:column;align-items:center;gap:0}
#dockTabs button.on{color:var(--ui-fg);border-top-color:var(--ui-accent);background:var(--ui-bg)}
.grip{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);width:44px;height:16px;border-radius:8px 8px 0 0;border-bottom:0;margin-bottom:-1px;font-size:10px;line-height:12px;padding:0}
.lab{font-size:12px;letter-spacing:.06em;color:var(--ui-mute);text-transform:uppercase;margin:8px 0 4px}
.lab:first-child{margin-top:0}
.row{display:flex;gap:0;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden;background:var(--ui-card)}
.row.gap{gap:8px;border:0;background:transparent;overflow:visible}
.row button{flex:1;background:transparent;border:0;border-right:1px solid var(--ui-line);padding:6px 6px;font-size:13px;color:var(--ui-fg)}
.row button:last-child{border-right:0}
.row button.on{background:var(--ui-field);box-shadow:inset 0 -2px 0 var(--ui-accent)}
.row.gap button{border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-card)}
.bigbtn{width:100%;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:8px;padding:7px;font-size:13px;color:var(--ui-fg)}
.bigbtn:hover,.row button:hover{background:var(--ui-field)}
.novelcard{display:flex;align-items:center;gap:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-card);padding:3px 8px;text-align:left}
.cover{width:34px;height:44px;border-radius:5px;background:linear-gradient(160deg,#c0762c,#5b2a0c 60%,#1b0d05);color:#ffe3b5;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.04em}
.novelcard small{display:block;color:var(--ui-mute);font-size:11px;letter-spacing:.08em}
.novelcard span{font-size:13px;line-height:1.2}
#dockPanel .nbtn{padding:4px 12px;font-size:13px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav .nbtn{min-width:76px}
.dnav .navmid{flex:1}
.novelcard .nt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.novelcard .chev{margin-left:auto;font-size:18px;color:var(--ui-mute)}
.two>*{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.switch{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px}
.switch input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--ui-line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ui-accent)}
.switch input:checked:after{left:19px}

/* drawers */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;transition:opacity .4s ease}
#scrim.show{opacity:1;transition:opacity .9s ease}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(420px,94vw);background:var(--ui-bg);color:var(--ui-fg);border-right:1px solid var(--ui-line);z-index:70;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .4s ease}
.drawer.open{transform:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ui-line)}
.dhead h3{margin:0;font-size:17px;flex:1}
.xbtn{background:transparent;border:0;color:var(--ui-fg);font-size:22px;line-height:1;padding:2px 6px}
.dtabs{display:flex;gap:2px}
.dtabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ui-mute);padding:6px 10px;font-size:14px}
.dtabs button.on{color:var(--ui-fg);border-bottom-color:var(--ui-accent)}
.dbody{flex:1;overflow:auto;padding:14px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--ui-line)}
.toc-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--ui-line);padding:12px 14px;color:var(--ui-fg)}
.toc-item b{display:block;font-weight:600;font-size:14px}
.toc-item small{color:var(--ui-mute);font-size:11px;letter-spacing:.05em}
.toc-item.on{color:var(--ui-accent)} .toc-item.on:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ui-accent);margin-left:8px}
.field{width:100%;background:var(--ui-field);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px}
.field:focus{outline:2px solid var(--ui-accent);outline-offset:-1px}
.frow{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px;font-size:13px}
.frow label{color:var(--ui-mute)}
.pill{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:5px 10px;font-size:13px;margin-left:6px}
.hint{font-size:12px;color:var(--ui-mute);margin:6px 0}
.btn{background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:9px 16px;font-size:14px}
.btn.pri{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
.trow{display:flex;gap:10px;align-items:center;border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.trow .tt{flex:1;font-size:13px;line-height:1.5;word-break:break-word}
.trow .tt small{color:var(--ui-mute);display:block}
.trow .tt b{font-weight:600}
.chipbtn{display:inline-block;border:1px solid var(--ui-line);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--ui-mute);margin:10px 0 8px}
.preview{background:#000;color:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:12px;font-size:15px;line-height:1.6}
.addterm{position:absolute;left:0;top:0;z-index:50;white-space:nowrap;background:var(--ui-card);color:var(--ui-accent);border:1px solid var(--ui-accent);border-radius:8px;padding:8px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.4)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.mbox{background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:12px;width:min(640px,100%);padding:16px}
.lib{display:flex;gap:12px;border:1px solid var(--ui-line);background:var(--ui-card);border-radius:10px;padding:10px;margin-top:10px}
.lib .cover{width:64px;height:86px;font-size:16px}
.lib h4{margin:0 0 4px;font-size:16px}
.lib p{margin:2px 0;color:var(--ui-mute);font-size:13px}
.bar{height:6px;background:var(--ui-line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ui-accent)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:#222;color:#fff;border:1px solid #444;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .18s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* term popover, badges, spinner */
.term{cursor:pointer}
.tpop{position:absolute;z-index:55;width:320px;max-width:calc(100vw - 16px);background:#0b0c0f;color:#fff;border:1px solid #2a2b30;border-radius:10px;padding:10px 12px;font:13px/1.4 system-ui,Segoe UI,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.tpop .pr{display:flex;align-items:center;gap:10px;margin:6px 0;min-height:24px}
.tpop .pr b{width:34px;text-align:right;font-size:12px;font-weight:700;flex:none}
.tpop .pf{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tpop .phelp{font-size:12px;color:#aeb0b8;margin:6px 0 0 44px}
.hbtn{width:30px;height:30px;border-radius:50%;border:1px solid #3a3b41;background:transparent;color:#fff;font-size:14px}
.bdg{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;max-width:100%}
.bdg i{font-style:normal;padding:3px 7px;display:flex;align-items:center}
.bdg em{font-style:normal;padding:3px 9px;display:flex;align-items:center;word-break:break-word}
.bdg.g i{background:#0a3a22;color:#d6ffe6} .bdg.g em{background:#0f7a40;color:#fff}
.bdg.b i{background:#16398a;color:#dbe6ff} .bdg.b em{background:#1f5bd1;color:#fff}
.bdg.opt{border:0;padding:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:#fff;background:none}
.bdg.opt:hover:not(:disabled){filter:brightness(1.2)}
.bdg.opt.on{outline:2px solid rgba(255,255,255,.65);outline-offset:1px}
.bdg.opt:disabled{cursor:default;opacity:.8}
.tin{background:transparent;border:0;outline:0;color:#fff;font:inherit;font-weight:700;padding:0;min-width:3ch;max-width:220px;cursor:text}
.bdg.g em.ed{padding:3px 9px}
.bdg.g em.ed:focus-within{background:#13924d}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.hrow .hint{margin:0}
.btn.danger{background:rgba(220,60,80,.12);color:var(--danger);border-color:rgba(220,60,80,.4)}
.btn.sq{padding:8px 12px;border-radius:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.spin.sm{width:14px;height:14px}
.btn.pri.sv:disabled{opacity:1;cursor:default;min-width:84px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- header icons, menu, search, user dropdown ---- */
.top{background:var(--ui-bg);color:var(--ui-fg);border-bottom:1px solid var(--ui-line);gap:8px;padding:8px 10px}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:9px;padding:0;flex:none}
.ibtn:hover,.ibtn.on{background:var(--ui-field)}
svg.i,.ibtn svg,[data-ic] svg,.mitem svg,.uitem svg,.mcard svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:.04em;margin-right:auto;color:var(--ui-fg)}
.brand svg{width:26px;height:26px;stroke-width:1.6}
.sbox{display:none;flex:1;align-items:center;gap:8px}
.top.searching .sbox{display:flex}
.top.searching .brand,.top.searching .hid-s{display:none}
.sinp{flex:1;min-width:0;background:var(--ui-field);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:9px;padding:9px 12px;font:inherit;font-size:15px}
.sinp:focus{outline:2px solid var(--ui-accent);outline-offset:-1px}
#searchRes{position:fixed;left:0;right:0;top:57px;bottom:0;background:var(--ui-bg);color:var(--ui-fg);overflow:auto;z-index:35}
.sres{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--ui-line);padding:12px 14px;color:var(--ui-fg)}
.sres b{display:block;font-weight:600;font-size:14px}
.sres span{display:block;color:var(--ui-mute);font-size:13px;margin-top:3px;line-height:1.4}
.sres mark{background:rgba(79,155,245,.3);color:inherit;border-radius:3px}
#userMenu{position:fixed;right:8px;top:58px;width:min(330px,calc(100vw - 16px));background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:65;padding:12px}
.ucard{border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.ucard .bar{margin:6px 0 0}
.uitem,.mitem{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;color:var(--ui-fg);padding:11px 8px;font-size:16px;text-align:left;border-radius:8px}
.uitem:hover,.mitem:hover{background:var(--ui-field)}
.uitem svg,.mitem svg{width:22px;height:22px}
.usep{border-top:1px solid var(--ui-line);margin:8px 0}
#menuDrawer{width:min(330px,86vw)}
#menuDrawer .dhead h3{font-size:18px;font-weight:600;letter-spacing:.04em}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--ui-card);border:1px solid var(--ui-line);color:var(--ui-fg);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px}
.mcard svg{width:20px;height:20px;margin-bottom:2px}
.mcard small{color:var(--ui-mute);font-size:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- bottom panel (dock): chevron + tabs ---- */
#dock{background:var(--ui-bg)}
.grip{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:46px;height:22px;border-radius:8px 8px 0 0;background:var(--ui-field);border:1px solid var(--ui-line);border-bottom:0;color:var(--ui-fg);display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.grip svg{width:18px;height:18px;stroke-width:2.4}
#dockTabs button svg,#dockTabs button .tt{width:22px;height:22px;font-size:19px;line-height:22px;font-weight:700;font-style:normal;display:block}
#dockTabs button{gap:3px;padding:8px 2px 7px}

/* ---- term editor as bottom sheet on phones ---- */
.top{transition:transform .22s}
.top.tuck{transform:translateY(-100%)}
@media (max-width:700px){
  :root{--maxw:100%}
  .top{padding:8px 8px}
  #reader{margin:0;padding:0;max-width:none}
  .card{background:transparent;border:0;border-bottom:3px double var(--pg-line);border-radius:0;margin:0;padding:12px 14px}
  #chCard{border-bottom:0;padding-bottom:40px}
  .novelname{font-size:14px;color:var(--pg-fg)}
  .chtitle{font-size:22px;line-height:1.35}
  .chip{font-size:13px;padding:4px 12px}
  .nbtn{border-radius:7px;background:transparent}
  #dockPanel,#dockTabs{width:100%;max-width:none;border-left:0;border-right:0;border-radius:0}
  #dockPanel{padding:12px 12px 6px;max-height:58vh}
  .row button,.bigbtn{padding:10px 6px;font-size:14px}
  .lab{margin:12px 0 6px}
  .toast{bottom:150px}
  .drawer{width:min(420px,88vw)}
  #termDrawer{left:0;right:0;top:auto;bottom:0;width:100%;max-height:94vh;border-right:0;border-top:1px solid var(--ui-line);border-radius:16px 16px 0 0;transform:translateY(104%)}
  #termDrawer.open{transform:none}
  #termDrawer.full{top:0;max-height:none;border-radius:0}
  #termDrawer .dhead{padding:10px 12px}
  #termDrawer .dtabs button{font-size:16px;padding:8px 10px}
  #termDrawer .dbody{padding:14px 12px}
  #termDrawer .dfoot{padding:10px 12px}
  #termDrawer .field{font-size:17px;padding:11px 12px}
  .tpop{width:min(320px,calc(100vw - 16px))}
}
/* ---- v3: calm reading, progress, new controls ---- */
#tint{position:fixed;inset:0;z-index:200;pointer-events:none;background:#ff8c28;mix-blend-mode:multiply;opacity:0;display:none}
#chBody .chhead{text-align:var(--head-align);margin:.3em 0 1.5em;font-weight:700;line-height:1.25;font-size:1em}
#chBody .chhead .kick{display:block;font-size:.5em;letter-spacing:.22em;text-transform:uppercase;color:var(--pg-mute);font-weight:600;margin-bottom:.7em}
#chBody .chhead .ttl{display:block;font-size:1.4em}
#chBody .chhead:after{content:"";display:block;width:2.4em;height:2px;border-radius:2px;background:var(--brk);opacity:.7;margin:.9em auto 0 var(--head-ml)}
#chBody .brk{display:flex;align-items:center;justify-content:center;gap:.9em;width:56%;margin:2.6em auto 2.4em;color:var(--brk);opacity:.9;font-size:.7em;line-height:1;letter-spacing:0;text-indent:0!important}
#chBody .brk:before,#chBody .brk:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
#chBody .brk:after{transform:scaleX(-1)}
.btn.pri{color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.themes button{min-height:58px;border:1px solid var(--ui-line);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:1.1}
.themes button b{font-size:19px;font-weight:700;font-family:Georgia,"Times New Roman",serif}
.themes button.on{outline:2px solid var(--ui-accent);outline-offset:2px}
.switch{min-height:44px;margin-top:2px}

.minleft{text-align:center;font-size:13px;color:var(--ui-mute);margin:8px 0 2px}
.auto{display:flex;align-items:center;gap:10px;margin-top:8px}
.auto .bigbtn{width:auto;flex:none;padding:0 16px}
.rgwrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}

.rg{flex:1;min-width:0;height:40px;margin:0;accent-color:var(--ui-accent);background:transparent}
.mhead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-mute);margin:10px 8px 8px;display:flex;justify-content:space-between}
.bmrow{display:flex;align-items:stretch;border:1px solid var(--ui-line);background:var(--ui-card);border-radius:8px;margin-bottom:8px;overflow:hidden}
.bmgo{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:9px 10px;color:var(--ui-fg);min-height:56px}

.bmdel{width:46px;flex:none;background:transparent;border:0;border-left:1px solid var(--ui-line);color:var(--ui-mute);font-size:22px}
.bmdel:hover{color:var(--danger)}
#castDrawer{left:auto;right:0;border-right:0;border-left:1px solid var(--ui-line);transform:translateX(102%);width:min(420px,94vw)}
#castDrawer.open{transform:none}
.csearch{padding:10px 14px;border-bottom:1px solid var(--ui-line)}
.cgroup{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:8px;color:var(--ui-fg);padding:0 12px;font-weight:600;font-size:14px;margin:12px 0 4px;text-align:left}
.cgroup:first-child{margin-top:0}
.cgroup small{color:var(--ui-mute);font-weight:400;margin-left:6px}
.cgroup svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none}
.cgroup.shut svg{transform:rotate(-90deg)}
.crow{padding:10px 4px;border-bottom:1px solid var(--ui-line)}
.crow b{font-size:15px;font-weight:700}
.crow .crole{font-size:13px;color:var(--ui-mute);line-height:1.45;margin-top:2px}
.crow .cmeta{font-size:12px;color:var(--ui-mute);margin-top:3px}
@media (max-width:700px){
  .row button,.nbtn,#dockPanel .nbtn{min-height:44px}
  .xbtn{min-width:44px;min-height:44px}
  #castDrawer{left:0;right:0;top:auto;bottom:0;width:100%;height:88vh;max-height:88vh;border:0;border-top:1px solid var(--ui-line);border-radius:16px 16px 0 0;transform:translateY(104%)}
  #castDrawer.open{transform:none}
}
#castTabs{margin:0 14px 10px;flex:none}
#castTabs button{min-height:40px}
.cnew{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--ui-accent);color:var(--ui-bg);font-size:11px;font-weight:700;vertical-align:2px;letter-spacing:.03em}
/* ---- opening animations: panels glide in slowly and close quickly ---- */
#dock{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#dock.pre{transform:translateY(105%);transition:transform .4s ease}
@keyframes inkFadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes inkFade{from{opacity:0}to{opacity:1}}
@keyframes inkPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#userMenu{animation:inkFadeDown .8s cubic-bezier(.2,.8,.2,1)}
#searchRes{animation:inkFade .7s ease}
.modal{animation:inkFade .8s ease}
#addTermBtn,#tpop{animation:inkPop .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition:none!important;scroll-behavior:auto!important}
  *:not(.spin),*:not(.spin):before,*:not(.spin):after{animation:none!important}
}

<script>
(function(){
"use strict";
var NOVEL = {"title": "Reclined Sovereign: Just an Ordinary Office Worker", "dir": "chapters/", "manifest": "chapters/index.json"};

    var a=Array.isArray(j)?j:(j&&(j.characters||j.cast))||[];

/* "On this chapter": find which known people are named in the text you are reading, in the order they first appear */
function castRegex(f){
  if(!castRe[f]){
    var src=f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),tail='';

    var best=-1;
    [c.name].concat(c.aka).forEach(function(f){
      if(!f||f.length<3)return;
      var m=castRegex(f).exec(raw);
      if(m){var at=m.index+(m[1]?m[1].length:0);if(best<0||at<best)best=at}
    });

  if(!ch||ch.raw==null){box.innerHTML='<div class="hint" style="padding:8px 2px">Loading this chapter...</div>';return}
  var q=castQ.trim().toLowerCase(),list=castHere(ch.raw,cur);
  if(q)list=list.filter(function(it){return it.c.name.toLowerCase().indexOf(q)>=0||it.c.aka.some(function(a){return a.toLowerCase().indexOf(q)>=0})});
  var h='<div class="hint" style="margin:0 0 4px">'+(q?'Matches in this chapter:':'People in Chapter '+cur+', in the order they appear:')+' '+list.length+'</div>';
  if(!list.length)h+='<div class="hint" style="padding:10px 2px">'+(q?'No one in this chapter matches "'+esc(castQ.trim())+'". Try "All so far".':'No known characters are named in this chapter yet. Try "All so far".')+'</div>';

}
function renderCastAll(){
  var box=$('#castBody'),cur=chapters[S.chIndex]?chapters[S.chIndex].n:1;
  if(castState==='loading'||castState==='idle'){box.innerHTML='<div class="hint" style="padding:8px 2px">Loading...</div>';return}
  if(castState==='fail'||!cast){box.innerHTML='<div class="hint" style="padding:8px 2px">Cast not available yet</div>';return}
  var q=castQ.trim().toLowerCase(),groups=[],gi={},shown=0;
  cast.filter(function(c){return c.first<=cur}).sort(function(a,b){return a.first-b.first}).forEach(function(c){
    if(q&&c.name.toLowerCase().indexOf(q)<0&&!c.aka.some(function(a){return a.toLowerCase().indexOf(q)>=0}))return;

  });

function exportTerms(){
  var blob=new Blob([JSON.stringify(terms,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='inkstone-terms.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Terms exported');
}
function renderConfig(body,foot){
  var h='<div class="dtabs" style="margin-bottom:10px" id="cfgTabs"><button data-ct="term">Term</button><button data-ct="text">Text</button><button data-ct="reader">Reader</button></div>';
  if(cfgTab==='term'){
    h+='<div class="lab">Terms Style</div>'+seg([['semi','Semi-Bold'],['bold','Bold'],['underline','Underline'],['italic','Italic']],cfg.termStyle,'cs');
    h+='<div class="lab">Your Saved Terms</div>'+seg([['c','Colored'],['d','Default']],cfg.userColored?'c':'d','cusr');
    h+='<div class="hint">Only terms you save are highlighted. Select text in a chapter, tap + Add Term, and it will be shown this way everywhere that text appears.</div>';
    h+='<div class="lab">Preview</div><div class="preview" id="pv"></div>';
  }else if(cfgTab==='text'){
    h+='<div class="lab">Text Align</div>'+seg([['left','Left'],['justify','Justify']],cfg.align,'calign');
    h+='<div class="lab">Paragraph Spacing</div>'+seg([['compact','Compact'],['normal','Normal'],['wide','Wide']],cfg.paraSpace,'cps');
    h+='<div class="lab">First-line Indent</div>'+seg([['off','Off'],['on','On']],cfg.indent?'on':'off','cind');
  }else{
    h+='<div class="lab">Content Width</div>'+seg([['narrow','Narrow'],['medium','Medium'],['wide','Wide']],cfg.width,'cw');
    h+='<div class="lab">Chapter Heading In Text</div>'+seg([['show','Show'],['hide','Hide']],cfg.showHeading?'show':'hide','chd');
  }
  body.innerHTML=h;
  $$('#cfgTabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-ct')===cfgTab);b.onclick=function(){cfgTab=b.getAttribute('data-ct');renderConfig(body,foot)}});
  function bind(attr,fn){$$('[data-'+attr+']',body).forEach(function(b){b.onclick=function(){fn(b.getAttribute('data-'+attr));renderConfig(body,foot)}})}
  bind('cs',function(v){cfg.termStyle=v});bind('cusr',function(v){cfg.userColored=v==='c'});
  bind('calign',function(v){cfg.align=v});bind('cps',function(v){cfg.paraSpace=v});bind('cind',function(v){cfg.indent=v==='on'});
  bind('cw',function(v){cfg.width=v});bind('chd',function(v){cfg.showHeading=v==='show'});
  var pv=$('#pv');if(pv){
    var st={semi:'600',bold:'700'}[cfg.termStyle]||'400',deco=cfg.termStyle==='underline'?'underline':'none',fi=cfg.termStyle==='italic'?'italic':'normal';
    function sp(t,c,on){return '<span style="font-weight:'+st+';text-decoration:'+deco+';font-style:'+fi+';color:'+(on?c:'#fff')+'">'+t+'</span>'}
    pv.innerHTML='“Is it good?” Chen Xuan took the cap back. “I just like that it’s hot.” Across the floor, Zhang Pengfei looked at his new watch, and your saved term '+sp('thermos','#8cbcff',cfg.userColored)+' sat in the middle of the desk.';
  }
  foot.innerHTML='';
  foot.appendChild(btn('Cancel','btn',function(){tTab='editor';renderTerms()}));
  foot.appendChild(btn('Save Changes','btn pri',function(){
    ['termStyle','sysColored','userColored','patchColored','align','paraSpace','indent','width','showHeading'].forEach(function(k){S[k]=cfg[k]});
    saveState();applyLook();renderChapter(S.chIndex,false);toast('Config saved');
  }));
}

/* ---------- library + import ---------- */
function openLibrary(){
  var box=$('#libBox');
  var pct=Math.floor((S.chIndex+1)/chapters.length*100);
  var wc=chapters.reduce(function(a,c){return a+c.words},0);
  box.innerHTML='<div class="dhead" style="padding:0 0 10px"><h3>Library</h3><button class="xbtn" id="libX">&times;</button></div>'+
    (S.inLibrary?('<div class="lib"><div class="cover">RS</div><div style="flex:1"><h4>'+esc(NOVEL.title)+'</h4><p>'+chapters.length+' chapters &middot; '+wc.toLocaleString()+' words &middot; reading Ch. '+chapters[S.chIndex].n+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row gap"><button class="btn sm" id="libCont">Continue reading</button><button class="btn sm" id="libImp">Import chapters</button><button class="btn sm" id="libRem">Remove</button></div></div></div>'):
    '<p class="hint">Your library is empty.</p><button class="btn pri" id="libAdd">Add "'+esc(NOVEL.title)+'" to library</button>');
  $('#libModal').classList.remove('hidden');
  $('#libX').onclick=function(){$('#libModal').classList.add('hidden')};
  var c=$('#libCont');if(c)c.onclick=function(){$('#libModal').classList.add('hidden')};
  var i=$('#libImp');if(i)i.onclick=function(){$('#fileIn').click()};
  var r=$('#libRem');if(r)r.onclick=function(){S.inLibrary=false;saveState();openLibrary();renderDock()};
  var a=$('#libAdd');if(a)a.onclick=function(){S.inLibrary=true;saveState();openLibrary();renderDock()};
}
function importFiles(files){
  var list=Array.prototype.slice.call(files),done=0,added=0;
  if(!list.length)return;
  list.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      var raw=String(rd.result||''),p=parseTitle(raw);
      if(p){imported[p.n]=raw;added++}
      if(++done===list.length){save('imported',imported);buildChapters();renderToc();renderChapter(S.chIndex,false);toast(added?('Imported '+added+' chapter'+(added>1?'s':'')):'No "# Chapter N: Title" heading found');}
    };rd.readAsText(f);
  });
}

/* ---------- misc ---------- */
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}
function dlChapter(){
  var c=chapters[S.chIndex];if(!c||c.raw==null){toast('Open the chapter first');return}
  var blob=new Blob([c.raw],{type:'text/markdown'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='Chapter_'+(c.n<10?'00':c.n<100?'0':'')+c.n+'.md';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Chapter downloaded');
}
function stepFont(d){S.fontSize=Math.max(14,Math.min(44,S.fontSize+d));applyLook();saveState();renderDock()}
function stepLH(d){S.lineH=Math.max(1.2,Math.min(2.5,Math.round((S.lineH+d)*10)/10));applyLook();saveState();renderDock()}

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a&&t.closest('#menuDrawer,#userMenu')){closeDrawers();closeTop()}
  if(a==='home'){}
  else if(a==='imp')$('#fileIn').click();
  else if(a==='exp')exportTerms();
  else if(a==='dl')dlChapter();
  else if(a==='disp'){showDock();setDock('display')}
  else if(a==='set'){showDock();setDock('settings')}
  else if(a==='prev')go(-1);else if(a==='next')go(1);else if(a==='toc'){renderToc();openDrawer('tocDrawer')}
  else if(a==='special')openSpecialDrawer();else if(a==='exitsp')exitSpecial();
  else if(a==='cast')openCast();else if(a==='bm')toggleBookmark();else if(a==='auto')autoStart();
  else if(a==='terms')openTerms('editor',null);else if(a==='adv')openTerms('config',null);
  else if(a==='lib')openLibrary();else if(a==='addlib'){S.inLibrary=!S.inLibrary;saveState();renderDock();toast(S.inLibrary?'Added to library':'Removed from library')}
  else if(a==='fs-')stepFont(-1);else if(a==='fs+')stepFont(1);else if(a==='lh-')stepLH(-.1);else if(a==='lh+')stepLH(.1);else if(a==='lh0'){S.lineH=DEF.lineH;applyLook();saveState();renderDock()}
  else if(a==='reset'){['font','fontSize','lineH','termColors','theme','tint','readerType','termStyle','sysColored','userColored','patchColored','align','paraSpace','indent','width','showHeading'].forEach(function(k){S[k]=DEF[k]});saveState();applyLook();renderChapter(S.chIndex,false);renderDock();toast('Display settings reset')}
  var d=t.getAttribute('data-font');if(d){S.font=d;applyLook();saveState();renderDock()}
  d=t.getAttribute('data-tcol');if(d){S.termColors=d==='on';applyLook();saveState();renderDock()}
  d=t.getAttribute('data-svc');if(d){S.service=d;saveState();applyLook();renderChapter(S.chIndex,false);renderDock()}
  d=t.getAttribute('data-th');if(d){S.theme=d;saveState();applyLook();renderDock()}
  d=t.getAttribute('data-bmgo');if(d)jumpBookmark(d);
  d=t.getAttribute('data-bmdel');if(d)deleteBookmark(d);
  d=t.getAttribute('data-cg');if(d){castShut[d]=!castShut[d];renderCast()}
  d=t.getAttribute('data-ctab');if(d){castTab=d;renderCast()}
  d=t.getAttribute('data-rtype');if(d){S.readerType=d;saveState();applyLook();renderChapter(S.chIndex,false);renderDock()}
  var c=t.getAttribute('data-close');if(c)closeDrawers();
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='swAuto'){S.autosave=e.target.checked;if(S.autosave)saveState();else try{localStorage.removeItem(LS+'state')}catch(x){}}
  else if(id==='swSwipe'){S.swipe=e.target.checked;saveState()}
  else if(id==='swTc'){S.termColors=e.target.checked;applyLook();saveState()}
  else if(id==='rgTint'||id==='rgSpeed')saveState();
});
/* sliders: change the look while dragging, without redrawing the panel */
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='rgTint'){S.tint=+e.target.value;applyLook();var tv=$('#tintVal');if(tv)tv.textContent=S.tint?S.tint+'%':'Off'}
  else if(id==='rgSpeed')S.autoSpeed=+e.target.value;
  else if(id==='castSearch'){castQ=e.target.value;renderCast()}
});
$('#prevTop').onclick=$('#prevBot').onclick=function(){go(-1)};
$('#nextTop').onclick=$('#nextBot').onclick=function(){go(1)};
$('#svcTop').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return});
$('#dockTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setDock(b.getAttribute('data-tab'))});
/* click the page to show the panel, click the page again to hide it */
document.addEventListener('click',function(e){
  var term=e.target.closest('#chBody .term');
  if(term){openPopover(term);return}
  if(!e.target.closest('#tpop'))closePopover();
  if(!e.target.closest('#userMenu,#btnUser')&&!$('#userMenu').classList.contains('hidden'))closeTop();
  if(e.target.closest('button,a,input,select,textarea,label,#dock,.drawer,.modal,#addTermBtn,.top,#scrim,#tpop,#userMenu,#searchRes'))return;
  if(String(window.getSelection()).trim())return;
  if($$('.drawer.open').length||!$('#libModal').classList.contains('hidden'))return;
  if($('#dock').classList.contains('hidden'))showDock();else hideDock();
});
$('#termTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tTab=b.getAttribute('data-tt');if(tTab==='config'){cfg=Object.assign({},S)}renderTerms()});
$('#scrim').onclick=closeDrawers;
$('#novelName').onclick=openLibrary;
$('#btnLibrary').onclick=function(){closeTop();openLibrary()};
$('#btnMenu').onclick=openMenu;
$('#btnSearch').onclick=openSearch;
$('#btnUser').onclick=toggleUser;
$('#sBack').onclick=closeSearch;
$('#sInput').oninput=function(){runSearch(this.value)};
$('#searchRes').addEventListener('click',function(e){var b=e.target.closest('[data-si]');if(!b)return;var i=+b.getAttribute('data-si');closeSearch();renderChapter(i)});
$('#gripBtn').onclick=hideDock;
window.addEventListener('resize',fitDock);
$('#libModal').addEventListener('click',function(e){if(e.target.id==='libModal')$('#libModal').classList.add('hidden')});
$('#fileIn').onchange=function(){importFiles(this.files);this.value=''};
$('#termIn').onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;var n=0;arr.forEach(function(t){if(t&&t.from){terms.unshift({id:'t'+Date.now()+n,from:String(t.from),to:String(t.to||''),cs:!!t.cs,novel:!!t.novel});n++}});save('terms',terms);renderChapter(S.chIndex,false);renderTerms();toast('Imported '+n+' terms')}catch(x){toast('That file is not a terms export')}};
  rd.readAsText(f);this.value='';
};
$('#addTermBtn').addEventListener('mousedown',function(e){e.preventDefault()});
$('#addTermBtn').addEventListener('click',function(){var s=String(window.getSelection()).trim().slice(0,128);if(s){openTerms('editor',s)}this.classList.add('hidden')});
var selT;document.addEventListener('selectionchange',function(){clearTimeout(selT);selT=setTimeout(function(){
  var sel=window.getSelection(),txt=sel?String(sel).trim():'',btn=$('#addTermBtn');
  if(txt&&txt.length<=128&&sel.rangeCount&&$('#chBody').contains(sel.getRangeAt(0).commonAncestorContainer)){btn.classList.remove('hidden');placeAddBtn(sel.getRangeAt(0),btn)}else btn.classList.add('hidden');
},180)});
/* the Add Term button follows the selected words (above them, or below if there is no room) */
function placeAddBtn(range,btn){
  var r=range.getBoundingClientRect(),bw=btn.offsetWidth||100,bh=btn.offsetHeight||36;
  var top=r.top-bh-10;if(top<64)top=r.bottom+10;
  var left=r.left+r.width/2-bw/2;left=Math.max(8,Math.min(left,document.documentElement.clientWidth-bw-8));
  btn.style.top=(top+window.scrollY)+'px';btn.style.left=(left+window.scrollX)+'px';
}
/* on phones the top bar slides away while you read down, and returns when you scroll up */
var lastY=0;
function tuckTop(){
  var y=window.scrollY,dy=y-lastY,bar=$('#topBar');
  if(bar.classList.contains('searching')||!$('#userMenu').classList.contains('hidden')||$('#menuDrawer').classList.contains('open')){bar.classList.remove('tuck');lastY=y;return}
  if(y<80||dy<-6)bar.classList.remove('tuck');else if(dy>6)bar.classList.add('tuck');
  if(Math.abs(dy)>6)lastY=y;
}
var scT,progRaf=0;
window.addEventListener('scroll',function(){
  tuckTop();infiniteTick();clearTimeout(scT);scT=setTimeout(persist,400);
  if(!progRaf)progRaf=requestAnimationFrame(function(){progRaf=0;updateProgress()});
},{passive:true});
window.addEventListener('resize',updateProgress);
document.addEventListener('visibilitychange',function(){if(document.hidden){persist();autoStop()}});
window.addEventListener('pagehide',persist);
/* touching or scrolling the page stops auto-scroll */
['touchstart','wheel','mousedown'].forEach(function(ev){document.addEventListener(ev,function(e){if(auto.on&&!(e.target.closest&&e.target.closest('#dock')))autoStop()},{passive:true,capture:true})});
/* swipe left or right on the reading area to change chapter */
var swipe=null;
document.addEventListener('touchstart',function(e){
  swipe=null;
  if(!S.swipe||e.touches.length!==1)return;
  var t=e.target;
  if(!t.closest||t.closest('#dock,.drawer,.modal,#userMenu,#searchRes,.top,#tpop,#addTermBtn,input,textarea,select'))return;
  var p=e.touches[0];swipe={x:p.clientX,y:p.clientY,t:Date.now()};
},{passive:true});
document.addEventListener('touchcancel',function(){swipe=null},{passive:true});
document.addEventListener('touchend',function(e){
  if(!swipe)return;var s0=swipe;swipe=null;
  var p=e.changedTouches[0],dx=p.clientX-s0.x,dy=p.clientY-s0.y;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||Date.now()-s0.t>900)return;
  if(String(window.getSelection()).trim())return;
  if($$('.drawer.open').length||!$('#libModal').classList.contains('hidden'))return;
  swipeGo(dx<0?1:-1);
},{passive:true});
function swipeGo(d){
  if(specialMode){
    var sni=specialIdx+d;
    if(sni<0){toast('This is the first special chapter');return}
    if(sni>=specials.length){toast('This is the last special chapter');return}
    toast(d>0?'Next special chapter':'Previous special chapter');go(d);
    return;
  }
  var ni=S.chIndex+d;
  if(ni<0){toast('This is the first chapter');return}
  if(ni>=chapters.length){toast('This is the last chapter');return}
  toast(d>0?'Next chapter':'Previous chapter');go(d);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePopover();closeDrawers();closeTop();hideDock();$('#libModal').classList.add('hidden');return}
  var id=(e.target||{}).id;
  if(e.key==='Enter'&&(id==='edFrom'||id==='edTo')){e.preventDefault();saveTermFlow();return}
  if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
});

/* ---------- boot ---------- */
function fetchManifest(){
  return fetch(NOVEL.manifest+'?t='+Date.now(),{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(m){NOVEL.chapters=m.chapters||[];if(m.title)NOVEL.title=m.title});
}
function startReader(){
  buildChapters();applyLook();renderToc();
  if(!chapters.length){
    $('#novelName').textContent=NOVEL.title;
    $('#chBody').innerHTML='<p class="hint" style="padding:10px 0">No chapters could be loaded from the "'+esc(NOVEL.dir)+'" folder. Open this page from the website, or from a local web server (run serve_inkstone.bat), or use the menu to import chapter files.</p>';
    return;
  }
  try{history.scrollRestoration='manual'}catch(e){}
  resume(S.chIndex);
  renderDock();
}
if(!NOVEL||!NOVEL.manifest){document.body.innerHTML='<p style="padding:30px">Reader is not configured. Run build_inkstone.py.</p>'}
else{
  fillIcons();
  NOVEL.chapters=[];
  fetchManifest().then(startReader,function(){startReader()});
}
})();
</script>
</body>
</html>
